<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>時距學習遊戲</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #fce4ec; /* 馬卡龍粉底色 */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif;
            overflow: hidden; /* 確保沒有捲軸 */
            touch-action: none; /* 停用預設觸控行為（如雙擊放大） */
        }
        #game-container {
            width: 100vw;
            height: 85vh; /* 高度85% */
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* 上方區域：關卡與提示 */
        #top-area {
            height: 12%;
            background-color: #e0f7fa; /* 馬卡龍藍 */
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            border-bottom: 4px solid #b2ebf2;
        }
        .level-btn, .hint-btn {
            font-size: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            background-color: #b3e5fc;
            color: #0277bd;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .level-btn.active {
            background-color: #ffb74d;
            color: #fff;
        }
        .level-group {
            display: flex;
            gap: 15px;
        }

        /* 中間區域：左中右佈局 */
        #middle-area {
            flex: 1;
            display: flex;
            flex-direction: row;
            padding: 10px;
        }
        
        /* 左右時鐘區域 */
        .clock-section {
            width: 35%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .clock-label {
            font-size: 28px;
            font-weight: bold;
            color: #8d6e63;
            margin-bottom: 10px;
        }
        .digital-time {
            font-size: 32px;
            font-weight: bold;
            color: #5c6bc0;
            margin-top: 15px;
            background-color: #e8eaf6;
            padding: 5px 20px;
            border-radius: 15px;
        }
        
        /* 中央輸入區域 */
        .center-section {
            width: 30%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #fff3e0; /* 馬卡龍橘底 */
            border-radius: 20px;
            padding: 15px 10px;
            position: relative;
        }
        .title-text {
            font-size: 36px;
            font-weight: bold;
            color: #ff7043;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        .question-text {
            font-size: 22px;
            font-weight: bold;
            color: #795548;
            margin-bottom: 15px;
        }
        .input-display {
            width: 90%;
            min-height: 60px;
            background-color: white;
            border: 3px dashed #ffb74d;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            font-weight: bold;
            color: #d84315;
            margin-bottom: 15px;
        }

        /* 縮小後的九宮格 */
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 160px; /* 縮小寬度 */
        }
        .numpad button {
            height: 45px; /* 縮小高度 */
            font-size: 20px; /* 縮小字體 */
            font-weight: bold;
            color: #4e342e;
            background-color: #ffe0b2;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px #ffcc80;
        }
        .numpad button:active {
            box-shadow: 0 0 #ffcc80;
            transform: translateY(4px);
        }
        .btn-clear { background-color: #ffcdd2 !important; box-shadow: 0 4px #ef9a9a !important; }
        .btn-unit { background-color: #c8e6c9 !important; box-shadow: 0 4px #a5d6a7 !important; font-size: 16px !important; }

        /* 確認按鈕放置於中央區域最下方 */
        .submit-btn {
            margin-top: auto; /* 將按鈕推到最底下 */
            width: 80%;
            height: 55px;
            font-size: 26px;
            font-weight: bold;
            color: white;
            background-color: #66bb6a;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 6px #43a047;
        }
        .submit-btn:active {
            box-shadow: 0 0 #43a047;
            transform: translateY(6px);
        }

        /* 時鐘 SVG 樣式 */
        svg {
            width: 100%;
            max-width: 280px;
            height: auto;
        }
        .clock-bg { fill: #ffffff; stroke: #81c784; stroke-width: 8; }
        .hour-mark { font-size: 18px; font-weight: bold; fill: #424242; text-anchor: middle; dominant-baseline: central; }
        /* 0,5,10...55分 刻度加粗 */
        .minute-mark-text { font-size: 14px; font-weight: 900; fill: #5e35b1; text-anchor: middle; dominant-baseline: central; }
        .hand-hour { stroke: #e53935; stroke-width: 8; stroke-linecap: round; }
        .hand-minute { stroke: #1e88e5; stroke-width: 6; stroke-linecap: round; }
        .center-dot { fill: #333; }

        #hint-text {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 235, 59, 0.9);
            padding: 5px 15px;
            border-radius: 10px;
            font-weight: bold;
            color: #e65100;
            display: none;
            z-index: 10;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- 上方區域 -->
    <div id="top-area">
        <div class="level-group">
            <button class="level-btn active" data-level="hour">小時</button>
            <button class="level-btn" data-level="minute">分鐘</button>
            <button class="level-btn" data-level="both">小時與分鐘</button>
        </div>
        <button class="hint-btn" id="hint-toggle">💡 提示: 關</button>
    </div>

    <!-- 中間區域 -->
    <div id="middle-area">
        
        <!-- 左：開始時間 -->
        <div class="clock-section">
            <div class="clock-label">開始時間</div>
            <svg id="start-clock" viewBox="0 0 200 200"></svg>
            <div class="digital-time" id="start-digital">12:00</div>
        </div>

        <!-- 中：標題、題目與縮小版輸入鍵盤 -->
        <div class="center-section">
            <div id="hint-text"></div>
            <div class="title-text">時距</div>
            <div class="question-text">經過了多少時間？</div>
            
            <div class="input-display" id="answer-display">_ 小時 _ 分鐘</div>
            
            <div class="numpad">
                <button class="num-key">1</button>
                <button class="num-key">2</button>
                <button class="num-key">3</button>
                <button class="num-key">4</button>
                <button class="num-key">5</button>
                <button class="num-key">6</button>
                <button class="num-key">7</button>
                <button class="num-key">8</button>
                <button class="num-key">9</button>
                <button class="btn-clear" id="btn-clear">清除</button>
                <button class="num-key">0</button>
                <button class="btn-unit" id="btn-unit">時/分</button>
            </div>

            <!-- 確認按鈕放置於最下方 -->
            <button class="submit-btn" id="btn-submit">✔️ 確定</button>
        </div>

        <!-- 右：結束時間 -->
        <div class="clock-section">
            <div class="clock-label">結束時間</div>
            <svg id="end-clock" viewBox="0 0 200 200"></svg>
            <div class="digital-time" id="end-digital">12:00</div>
        </div>

    </div>
</div>

<script>
    // Web Audio API 音效
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'correct') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
            osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(250, audioCtx.currentTime);
            osc.frequency.setValueAtTime(200, audioCtx.currentTime + 0.2);
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // 遊戲狀態與變數
    let currentLevel = 'hour';
    let inputH = '';
    let inputM = '';
    let inputMode = 'hour'; // 'hour' 或 'minute'
    let correctDiffH = 0;
    let correctDiffM = 0;

    // 繪製時鐘 SVG
    function drawClock(svgId, h, m) {
        const svg = document.getElementById(svgId);
        let html = `<circle cx="100" cy="100" r="90" class="clock-bg" />`;
        
        // 畫分鐘外圈標籤 (0, 5, 10...55)
        for (let i = 0; i < 60; i += 5) {
            const angle = (i * 6 - 90) * Math.PI / 180;
            const x = 100 + 78 * Math.cos(angle);
            const y = 100 + 78 * Math.sin(angle);
            html += `<text x="${x}" y="${y}" class="minute-mark-text">${i}</text>`;
        }

        // 畫小時數字 (1-12)
        for (let i = 1; i <= 12; i++) {
            const angle = (i * 30 - 90) * Math.PI / 180;
            const x = 100 + 55 * Math.cos(angle);
            const y = 100 + 55 * Math.sin(angle);
            html += `<text x="${x}" y="${y}" class="hour-mark">${i}</text>`;
        }

        // 畫指針
        const hourAngle = ((h % 12 + m / 60) * 30 - 90) * Math.PI / 180;
        const hX = 100 + 35 * Math.cos(hourAngle);
        const hY = 100 + 35 * Math.sin(hourAngle);
        html += `<line x1="100" y1="100" x2="${hX}" y2="${hY}" class="hand-hour" />`;

        const minAngle = (m * 6 - 90) * Math.PI / 180;
        const mX = 100 + 60 * Math.cos(minAngle);
        const mY = 100 + 60 * Math.sin(minAngle);
        html += `<line x1="100" y1="100" x2="${mX}" y2="${mY}" class="hand-minute" />`;
        
        html += `<circle cx="100" cy="100" r="5" class="center-dot" />`;
        svg.innerHTML = html;
    }

    // 格式化數字為兩位數
    function padZero(num) { return num.toString().padStart(2, '0'); }

    // 產生新題目
    function generateQuestion() {
        let startH = Math.floor(Math.random() * 10) + 1; // 1-10
        let startM = Math.floor(Math.random() * 12) * 5; // 0,5,10...55
        
        if (currentLevel === 'hour') {
            correctDiffH = Math.floor(Math.random() * 3) + 1;
            correctDiffM = 0;
        } else if (currentLevel === 'minute') {
            correctDiffH = 0;
            correctDiffM = (Math.floor(Math.random() * 11) + 1) * 5; // 5-55
        } else {
            correctDiffH = Math.floor(Math.random() * 2) + 1;
            correctDiffM = (Math.floor(Math.random() * 11) + 1) * 5;
        }

        let totalStartMins = startH * 60 + startM;
        let totalEndMins = totalStartMins + correctDiffH * 60 + correctDiffM;
        
        let endH = Math.floor(totalEndMins / 60);
        let endM = totalEndMins % 60;
        if (endH > 12) endH -= 12;

        drawClock('start-clock', startH, startM);
        document.getElementById('start-digital').innerText = `${startH}時${startM}分`;
        
        drawClock('end-clock', endH, endM);
        document.getElementById('end-digital').innerText = `${endH}時${endM}分`;

        // 更新提示
        document.getElementById('hint-text').innerText = `提示：相差了 ${correctDiffH} 小時 ${correctDiffM} 分鐘`;
        
        inputH = ''; inputM = ''; 
        inputMode = currentLevel === 'minute' ? 'minute' : 'hour';
        updateDisplay();
    }

    // 更新輸入顯示
    function updateDisplay() {
        let displayStr = '';
        if (currentLevel === 'hour') {
            displayStr = `${inputH || '_'} 小時`;
        } else if (currentLevel === 'minute') {
            displayStr = `${inputM || '_'} 分鐘`;
        } else {
            let hStr = inputH || '_';
            let mStr = inputM || '_';
            displayStr = `${hStr} 小時 ${mStr} 分鐘`;
            // 高亮當前輸入單位
            if (inputMode === 'hour') displayStr = `[${hStr} 小時] ${mStr} 分鐘`;
            else displayStr = `${hStr} 小時 [${mStr} 分鐘]`;
        }
        document.getElementById('answer-display').innerText = displayStr;
    }

    // 處理數字鍵盤輸入
    document.querySelectorAll('.num-key').forEach(btn => {
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            playSound('click');
            let val = btn.innerText;
            if (inputMode === 'hour') {
                if (inputH.length < 2) inputH += val;
            } else {
                if (inputM.length < 2) inputM += val;
            }
            updateDisplay();
        });
        // 為了相容滑鼠點擊
        btn.addEventListener('mousedown', (e) => {
            playSound('click');
            let val = btn.innerText;
            if (inputMode === 'hour') {
                if (inputH.length < 2) inputH += val;
            } else {
                if (inputM.length < 2) inputM += val;
            }
            updateDisplay();
        });
    });

    // 切換輸入單位 (小時/分鐘)
    const unitBtn = document.getElementById('btn-unit');
    const handleUnitToggle = (e) => {
        if(e) e.preventDefault();
        playSound('click');
        if (currentLevel === 'both') {
            inputMode = inputMode === 'hour' ? 'minute' : 'hour';
            updateDisplay();
        }
    };
    unitBtn.addEventListener('touchstart', handleUnitToggle);
    unitBtn.addEventListener('mousedown', handleUnitToggle);

    // 清除按鈕
    const clearBtn = document.getElementById('btn-clear');
    const handleClear = (e) => {
        if(e) e.preventDefault();
        playSound('click');
        if (inputMode === 'hour') inputH = '';
        else inputM = '';
        updateDisplay();
    };
    clearBtn.addEventListener('touchstart', handleClear);
    clearBtn.addEventListener('mousedown', handleClear);

    // 確認按鈕
    const submitBtn = document.getElementById('btn-submit');
    const handleSubmit = (e) => {
        if(e) e.preventDefault();
        let ansH = parseInt(inputH) || 0;
        let ansM = parseInt(inputM) || 0;
        
        if (ansH === correctDiffH && ansM === correctDiffM) {
            playSound('correct');
            document.getElementById('answer-display').style.backgroundColor = '#c8e6c9';
            setTimeout(() => {
                document.getElementById('answer-display').style.backgroundColor = 'white';
                generateQuestion();
            }, 1000);
        } else {
            playSound('wrong');
            document.getElementById('answer-display').style.backgroundColor = '#ffcdd2';
            setTimeout(() => {
                document.getElementById('answer-display').style.backgroundColor = 'white';
                inputH = ''; inputM = ''; updateDisplay();
            }, 800);
        }
    };
    submitBtn.addEventListener('touchstart', handleSubmit);
    submitBtn.addEventListener('mousedown', handleSubmit);

    // 關卡切換
    document.querySelectorAll('.level-btn').forEach(btn => {
        const handleLevel = (e) => {
            if(e) e.preventDefault();
            playSound('click');
            document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentLevel = btn.getAttribute('data-level');
            generateQuestion();
        };
        btn.addEventListener('touchstart', handleLevel);
        btn.addEventListener('mousedown', handleLevel);
    });

    // 提示切換
    const hintBtn = document.getElementById('hint-toggle');
    let hintOn = false;
    const handleHint = (e) => {
        if(e) e.preventDefault();
        playSound('click');
        hintOn = !hintOn;
        hintBtn.innerText = hintOn ? '💡 提示: 開' : '💡 提示: 關';
        document.getElementById('hint-text').style.display = hintOn ? 'block' : 'none';
    };
    hintBtn.addEventListener('touchstart', handleHint);
    hintBtn.addEventListener('mousedown', handleHint);

    // 啟動遊戲
    generateQuestion();
</script>
</body>
</html>
