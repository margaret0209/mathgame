<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>排列數字的大小</title>
    <style>
        :root {
            /* 馬卡龍色系 */
            --bg-main: #FFF5F5;
            --color-primary: #FFB7B2;
            --color-secondary: #E2F0CB;
            --color-tertiary: #C7CEEA;
            --color-text: #555555;
            --color-white: #FFFFFF;
            --color-box-bg: rgba(255, 255, 255, 0.6);
            --color-box-border: #D1D1D1;
            --color-success: #A8E6CF;
            --color-error: #FF8B94;
            
            --font-main: 'Comic Sans MS', 'Arial Rounded MT Bold', 'PingFang HK', '微軟正黑體', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* 防止文字被選取 */
            -webkit-user-select: none;
            -webkit-touch-callout: none; /* 防止長按選單 */
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-main);
            color: var(--color-text);
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* 防止滾動 */
            display: flex;
            flex-direction: column;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: absolute;
            top: 0;
            left: 0;
            background: linear-gradient(135deg, #FFF5F5 0%, #F3E5F5 100%);
        }

        .screen.active {
            display: flex;
        }

        /* 標題與按鈕共用 */
        h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            color: #FF9AA2;
            text-shadow: 2px 2px 0px #FFF, 4px 4px 0px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            text-align: center;
        }

        .btn {
            background-color: var(--color-primary);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 0px #E5989B, 0 10px 10px rgba(0,0,0,0.2);
            transition: transform 0.1s, box-shadow 0.1s;
            touch-action: manipulation;
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0px #E5989B, 0 4px 4px rgba(0,0,0,0.2);
        }

        .btn-green { background-color: #B5EAD7; box-shadow: 0 6px 0px #95C9B7; }
        .btn-green:active { box-shadow: 0 0px 0px #95C9B7; }

        .setup-container {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .setup-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
        }

        .setup-label {
            font-size: 1.5rem;
            font-weight: bold;
            min-width: 120px;
        }

        .option-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .option-btn {
            background-color: #F0F0F0;
            color: #777;
            border: 2px solid #E0E0E0;
            border-radius: 15px;
            padding: 10px 20px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn.selected {
            background-color: var(--color-tertiary);
            color: white;
            border-color: #A0A8C9;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transform: scale(1.05);
        }

        #game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            height: 8%;
            background: rgba(255,255,255,0.5);
            border-bottom: 3px dashed #FFD1DC;
        }

        .timer { font-size: 2rem; font-weight: bold; color: #FF8B94; }
        
        #players-container {
            width: 100%;
            height: 92%;
            display: flex;
            flex-direction: row; /* 修改：改為橫向排列，分割為左右或左中右 */
            gap: 10px;
            padding: 10px;
        }

        .player-board {
            flex: 1;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            display: flex;
            flex-direction: column; /* 修改：玩家各自區域改為直向排列 */
            align-items: stretch;
            padding: 10px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
            border: 4px solid;
            position: relative;
        }

        .player-info {
            width: 100%; /* 修改：佔滿上方寬度 */
            display: flex;
            flex-direction: row; /* 修改：資訊列橫向並排 */
            justify-content: space-around;
            align-items: center;
            border-right: none; /* 移除原本的右邊線 */
            border-bottom: 3px dashed rgba(0,0,0,0.1); /* 改為底部分隔線 */
            padding-bottom: 10px;
            margin-bottom: 5px;
        }

        .player-score {
            font-size: clamp(1.2rem, 2vw, 2.5rem); /* 修改：自適應字體大小 */
            font-weight: bold;
            color: #555;
            background: white;
            padding: 5px 15px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .order-hint {
            font-size: clamp(0.9rem, 1.5vw, 1.2rem); /* 修改：自適應字體大小 */
            font-weight: bold;
            text-align: center;
            background: #FFE8A1;
            padding: 5px 10px;
            border-radius: 10px;
            color: #A67C00;
        }

        .game-area {
            width: 100%; /* 修改：佔滿下方寬度 */
            flex: 1;
            display: flex;
            flex-direction: column;
            padding-left: 0;
            justify-content: space-around;
        }

        .drop-zones, .start-zone {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            height: 45%;
        }

        .drop-box {
            width: 15%;
            aspect-ratio: 1 / 1; /* 調整為正方形以減少高度 */
            height: auto;
            max-height: 90%;
            background-color: var(--color-box-bg);
            border: 3px dashed var(--color-box-border);
            border-radius: 10px; 
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
            position: relative; /* 確保內部的卡片可以絕對定位完全重疊 */
        }

        .drop-box.highlight {
            background-color: rgba(255, 232, 161, 0.5); /* 拖曳經過時的提示 */
            border-color: #FFD166;
        }

        .number-card {
            width: 15%;
            aspect-ratio: 1 / 1; /* 調整為正方形以減少高度 */
            height: auto;
            max-height: 90%;
            background-color: white;
            border-radius: 10px; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(0.8rem, 2vw, 2.5rem); 
            font-weight: bold;
            color: #444;
            box-shadow: 0 5px 0px #CCC, 0 8px 10px rgba(0,0,0,0.15);
            cursor: grab;
            touch-action: none; /* 必須：防止觸控時滾動畫面 */
            transition: transform 0.1s;
        }

        /* 新增：當數字方塊放入答案方格時，使其完全填滿並蓋住虛線邊框 */
        .drop-box .number-card {
            position: absolute;
            top: -3px;
            left: -3px;
            width: calc(100% + 6px); /* 補足並蓋過 3px 的虛線邊框 */
            height: calc(100% + 6px);
            margin: 0;
            z-index: 5;
            box-shadow: 0 2px 0px #CCC, 0 4px 5px rgba(0,0,0,0.1); /* 放入後讓陰影變淺，感覺更服貼 */
        }

        .number-card:active { cursor: grabbing; }

        /* 動態產生 dragging 的分身 */
        .number-card.is-dragging {
            opacity: 0.4;
        }

        .drag-clone {
            position: fixed;
            pointer-events: none; /* 讓事件穿透到底下的 box */
            z-index: 1000;
            box-shadow: 0 15px 25px rgba(0,0,0,0.3);
            transform: scale(1.1);
        }

        /* 玩家專屬色 */
        .player-1 { border-color: var(--color-primary); background-color: rgba(255, 183, 178, 0.2); }
        .player-1 .number-card { background-color: var(--color-primary); color: white; box-shadow: 0 5px 0px #E5989B; }
        .player-1 .drop-box .number-card { box-shadow: 0 2px 0px #E5989B; } /* 放入後的專屬陰影 */
        
        .player-2 { border-color: var(--color-secondary); background-color: rgba(226, 240, 203, 0.2); }
        .player-2 .number-card { background-color: var(--color-secondary); color: #555; box-shadow: 0 5px 0px #C3D1AE; }
        .player-2 .drop-box .number-card { box-shadow: 0 2px 0px #C3D1AE; }
        
        .player-3 { border-color: var(--color-tertiary); background-color: rgba(199, 206, 234, 0.2); }
        .player-3 .number-card { background-color: var(--color-tertiary); color: white; box-shadow: 0 5px 0px #A0A8C9; }
        .player-3 .drop-box .number-card { box-shadow: 0 2px 0px #A0A8C9; }

        /* 動畫效果 */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); }
            50% { transform: translateX(5px) rotate(2deg); }
            75% { transform: translateX(-5px) rotate(-2deg); }
            100% { transform: translateX(0); }
        }
        .wrong-anim { animation: shake 0.4s ease-in-out; }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .correct-anim { animation: pop 0.4s ease-in-out; }

        #result-container {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            text-align: center;
            width: 80%;
            max-width: 600px;
        }

        .result-row {
            font-size: 2rem;
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            border-radius: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 1. 設定畫面 -->
    <div id="setup-screen" class="screen active">
        <h1>🔢 排列數字的大小</h1>
        <div class="setup-container">
            <div class="setup-row">
                <div class="setup-label">數字範圍：</div>
                <div class="option-group" id="opt-range">
                    <button class="option-btn selected" data-val="1-99">1-99</button>
                    <button class="option-btn" data-val="10-999">10-999</button>
                    <button class="option-btn" data-val="100-999">100-999</button>
                    <button class="option-btn" data-val="1000-9999">1000-9999</button>
                    <button class="option-btn" data-val="10000-99999">10000-99999</button>
                </div>
            </div>
            
            <div class="setup-row">
                <div class="setup-label">排序題型：</div>
                <div class="option-group" id="opt-order">
                    <button class="option-btn selected" data-val="asc">由小至大 (↗)</button>
                    <button class="option-btn" data-val="desc">由大至小 (↘)</button>
                    <button class="option-btn" data-val="random">隨機 (❓)</button>
                </div>
            </div>

            <div class="setup-row">
                <div class="setup-label">遊玩人數：</div>
                <div class="option-group" id="opt-players">
                    <button class="option-btn selected" data-val="1">1 人 🧍</button>
                    <button class="option-btn" data-val="2">2 人 🧍🧍</button>
                    <button class="option-btn" data-val="3">3 人 🧍🧍🧍</button>
                </div>
            </div>

            <div class="setup-row">
                <div class="setup-label">遊戲時間：</div>
                <div class="option-group" id="opt-time">
                    <button class="option-btn selected" data-val="60">1 分鐘 ⏳</button>
                    <button class="option-btn" data-val="180">3 分鐘 ⏳</button>
                    <button class="option-btn" data-val="300">5 分鐘 ⏳</button>
                </div>
            </div>

            <button class="btn btn-green" id="btn-start" style="margin-top: 20px; align-self: center;">開始遊戲 ▶</button>
        </div>
    </div>

    <!-- 2. 遊戲畫面 -->
    <div id="game-screen" class="screen">
        <div id="game-header">
            <h2 style="color: #A0A8C9;">🧩 將數字拖拉到方格內</h2>
            <div class="timer" id="timer-display">01:00</div>
        </div>
        <div id="players-container">
            <!-- 玩家版面將透過 JS 動態生成 -->
        </div>
    </div>

    <!-- 3. 結果畫面 -->
    <div id="result-screen" class="screen">
        <h1>🎉 遊戲結束 🎉</h1>
        <div id="result-container">
            <!-- 成績將透過 JS 動態生成 -->
        </div>
        <br>
        <button class="btn btn-green" onclick="resetToSetup()">🏠 回到主選單</button>
    </div>

    <script>
        /**
         * 遊戲狀態與設定資料
         */
        const GAME_STATE = {
            rangeMin: 1,
            rangeMax: 99,
            orderType: 'asc', // 'asc', 'desc', 'random'
            numPlayers: 1,
            timeTotal: 60,
            timeRemaining: 60,
            timerId: null,
            playersData: [] // 儲存各玩家的分數與當前題目要求
        };

        /**
         * 離線音效合成器 (Web Audio API)
         * 產生簡單的提示音，不需依賴外部檔案
         */
        const AudioSys = (function() {
            let ctx = null;
            function init() {
                if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            function playOscillator(type, freq, duration, vol=0.5) {
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                
                gain.gain.setValueAtTime(vol, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            }

            return {
                init,
                click: () => playOscillator('sine', 600, 0.1, 0.3),
                pop: () => playOscillator('sine', 800, 0.1, 0.3),
                correct: () => {
                    playOscillator('triangle', 523.25, 0.1, 0.4); // C5
                    setTimeout(() => playOscillator('triangle', 659.25, 0.2, 0.4), 100); // E5
                    setTimeout(() => playOscillator('triangle', 783.99, 0.3, 0.4), 200); // G5
                },
                wrong: () => {
                    playOscillator('sawtooth', 200, 0.3, 0.4);
                    setTimeout(() => playOscillator('sawtooth', 150, 0.4, 0.4), 150);
                },
                end: () => {
                    playOscillator('square', 440, 0.5, 0.3);
                    setTimeout(() => playOscillator('square', 554, 0.5, 0.3), 200);
                    setTimeout(() => playOscillator('square', 659, 1.0, 0.3), 400);
                }
            };
        })();

        // 綁定設定畫面的按鈕事件
        document.querySelectorAll('.option-group').forEach(group => {
            group.addEventListener('click', (e) => {
                if (e.target.classList.contains('option-btn')) {
                    AudioSys.init(); // 確保使用者互動後解鎖音效
                    AudioSys.click();
                    // 移除同組其他按鈕的 selected
                    group.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
                    // 加上自己的 selected
                    e.target.classList.add('selected');
                }
            });
        });

        document.getElementById('btn-start').addEventListener('click', () => {
            AudioSys.init();
            AudioSys.click();
            applySettings();
            startGame();
        });

        // 讀取設定值
        function applySettings() {
            const rangeVal = document.querySelector('#opt-range .selected').dataset.val.split('-');
            GAME_STATE.rangeMin = parseInt(rangeVal[0]);
            GAME_STATE.rangeMax = parseInt(rangeVal[1]);
            GAME_STATE.orderType = document.querySelector('#opt-order .selected').dataset.val;
            GAME_STATE.numPlayers = parseInt(document.querySelector('#opt-players .selected').dataset.val);
            GAME_STATE.timeTotal = parseInt(document.querySelector('#opt-time .selected').dataset.val);
            GAME_STATE.timeRemaining = GAME_STATE.timeTotal;
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startGame() {
            switchScreen('game-screen');
            updateTimerDisplay();
            
            // 初始化玩家資料
            GAME_STATE.playersData = [];
            const container = document.getElementById('players-container');
            container.innerHTML = ''; // 清空

            for (let i = 1; i <= GAME_STATE.numPlayers; i++) {
                GAME_STATE.playersData.push({
                    id: i,
                    score: 0,
                    currentOrder: GAME_STATE.orderType === 'random' ? (Math.random()>0.5?'asc':'desc') : GAME_STATE.orderType
                });
                
                // 動態產生玩家版面
                container.appendChild(createPlayerBoard(i));
                // 產生第一輪題目
                generateRoundForPlayer(i);
            }

            // 綁定拖曳事件 (使用事件委託處理多點觸控與滑鼠)
            initDragAndDrop();

            // 開始倒數
            clearInterval(GAME_STATE.timerId);
            GAME_STATE.timerId = setInterval(tickTimer, 1000);
        }

        // 建立個別玩家的 UI 區塊
        function createPlayerBoard(playerId) {
            const board = document.createElement('div');
            board.className = `player-board player-${playerId}`;
            board.dataset.playerId = playerId;

            // HTML 結構 (修改 inline style 以適應新排版)
            board.innerHTML = `
                <div class="player-info">
                    <div style="font-size: clamp(1.2rem, 2vw, 2rem); font-weight: bold;">👤 P${playerId}</div>
                    <div class="player-score" id="score-p${playerId}">0</div>
                    <div class="order-hint" id="hint-p${playerId}">載入中...</div>
                    <button class="btn btn-green" style="padding: 5px 15px; font-size:clamp(0.9rem, 1.5vw, 1.2rem);" onclick="submitAnswer(${playerId})">提交 ✅</button>
                </div>
                <div class="game-area">
                    <div class="drop-zones" id="drop-zones-p${playerId}">
                        <div class="drop-box" data-box-index="0"></div>
                        <div class="drop-box" data-box-index="1"></div>
                        <div class="drop-box" data-box-index="2"></div>
                        <div class="drop-box" data-box-index="3"></div>
                        <div class="drop-box" data-box-index="4"></div>
                        <div class="drop-box" data-box-index="5"></div>
                    </div>
                    <div class="start-zone" id="start-zone-p${playerId}">
                        <!-- 卡片將產生於此 -->
                    </div>
                </div>
            `;
            return board;
        }

        // 產生一局新題目
        function generateRoundForPlayer(playerId) {
            const pData = GAME_STATE.playersData[playerId - 1];
            
            // 處理隨機題型
            if (GAME_STATE.orderType === 'random') {
                pData.currentOrder = Math.random() > 0.5 ? 'asc' : 'desc';
            }
            
            // 更新提示字眼
            const hintEl = document.getElementById(`hint-p${playerId}`);
            hintEl.innerText = pData.currentOrder === 'asc' ? '由小至大 ↗' : '由大至小 ↘';
            hintEl.style.backgroundColor = pData.currentOrder === 'asc' ? '#FFE8A1' : '#FFD1DC'; // 顏色區分

            // 產生 6 個不重複的隨機數字
            let numbers = new Set();
            while(numbers.size < 6) {
                const num = Math.floor(Math.random() * (GAME_STATE.rangeMax - GAME_STATE.rangeMin + 1)) + GAME_STATE.rangeMin;
                numbers.add(num);
            }
            const numArr = Array.from(numbers);
            
            // 儲存正確答案以便驗證
            pData.correctArray = [...numArr].sort((a, b) => pData.currentOrder === 'asc' ? a - b : b - a);

            // 清理畫面
            document.getElementById(`drop-zones-p${playerId}`).querySelectorAll('.drop-box').forEach(box => box.innerHTML = '');
            const startZone = document.getElementById(`start-zone-p${playerId}`);
            startZone.innerHTML = '';

            // 產生卡片DOM
            numArr.forEach(num => {
                const card = document.createElement('div');
                card.className = 'number-card';
                card.dataset.value = num;
                card.innerText = num;
                // 添加識別，方便知道卡片屬於哪個玩家
                card.dataset.ownerId = playerId;
                startZone.appendChild(card);
            });
        }

        // 管理多點觸控的狀態字典
        const activeDrags = {};

        function initDragAndDrop() {
            const container = document.getElementById('players-container');
            
            // 觸控事件 (支援多點)
            container.addEventListener('touchstart', handleDragStart, { passive: false });
            document.addEventListener('touchmove', handleDragMove, { passive: false });
            document.addEventListener('touchend', handleDragEnd);
            document.addEventListener('touchcancel', handleDragEnd);

            // 滑鼠事件 (單點)
            container.addEventListener('mousedown', handleDragStart);
            document.addEventListener('mousemove', handleDragMove);
            document.addEventListener('mouseup', handleDragEnd);
        }

        function handleDragStart(e) {
            const isTouch = e.type === 'touchstart';
            // 如果是觸控，處理所有新增的觸控點；如果是滑鼠，包裝成陣列處理
            const points = isTouch ? e.changedTouches : [e];

            for (let i = 0; i < points.length; i++) {
                const point = points[i];
                const target = document.elementFromPoint(point.clientX, point.clientY);

                if (target && target.classList.contains('number-card')) {
                    if(!isTouch) e.preventDefault(); // 滑鼠需要 prevent 防止選取

                    const pointerId = isTouch ? point.identifier : 'mouse';
                    
                    // 防止同一張卡片被多隻手指抓取
                    if (target.classList.contains('is-dragging')) continue;

                    AudioSys.pop();
                    target.classList.add('is-dragging');

                    // 記錄原始位置資訊
                    const rect = target.getBoundingClientRect();
                    const offsetX = point.clientX - rect.left;
                    const offsetY = point.clientY - rect.top;

                    // 創建分身 (clone) 跟隨手指，避免影響 flex 佈局
                    const clone = target.cloneNode(true);
                    clone.classList.remove('is-dragging');
                    clone.classList.add('drag-clone');
                    clone.style.width = `${rect.width}px`;
                    clone.style.height = `${rect.height}px`;
                    clone.style.left = `${rect.left}px`;
                    clone.style.top = `${rect.top}px`;
                    document.body.appendChild(clone);

                    activeDrags[pointerId] = {
                        original: target,
                        clone: clone,
                        offsetX: offsetX,
                        offsetY: offsetY,
                        playerId: target.dataset.ownerId
                    };
                }
            }
        }

        function handleDragMove(e) {
            const isTouch = e.type.startsWith('touch');
            if (Object.keys(activeDrags).length > 0 && e.cancelable) {
                e.preventDefault(); // 防止滾動畫布
            }

            const points = isTouch ? e.changedTouches : [e];

            for (let i = 0; i < points.length; i++) {
                const point = points[i];
                const pointerId = isTouch ? point.identifier : 'mouse';
                const dragData = activeDrags[pointerId];

                if (dragData) {
                    // 更新分身位置
                    dragData.clone.style.left = `${point.clientX - dragData.offsetX}px`;
                    dragData.clone.style.top = `${point.clientY - dragData.offsetY}px`;
                    
                    // 檢查下方是否為有效的放置區 (高亮提示)
                    dragData.clone.style.display = 'none'; // 暫時隱藏以取得下方元素
                    const elemBelow = document.elementFromPoint(point.clientX, point.clientY);
                    dragData.clone.style.display = 'flex';

                    // 移除舊的高亮
                    document.querySelectorAll('.drop-box.highlight').forEach(el => el.classList.remove('highlight'));
                    
                    // 必須是同一個玩家的板子裡的 box
                    if (elemBelow && elemBelow.classList.contains('drop-box')) {
                        const board = elemBelow.closest('.player-board');
                        if(board && board.dataset.playerId === dragData.playerId) {
                            elemBelow.classList.add('highlight');
                        }
                    }
                }
            }
        }

        function handleDragEnd(e) {
            const isTouch = e.type.startsWith('touch');
            const points = isTouch ? e.changedTouches : [e];

            for (let i = 0; i < points.length; i++) {
                const point = points[i];
                const pointerId = isTouch ? point.identifier : 'mouse';
                const dragData = activeDrags[pointerId];

                if (dragData) {
                    const original = dragData.original;
                    const clone = dragData.clone;
                    
                    // 清理高亮
                    document.querySelectorAll('.drop-box.highlight').forEach(el => el.classList.remove('highlight'));

                    // 找出放開時下方的元素
                    clone.style.display = 'none';
                    const elemBelow = document.elementFromPoint(point.clientX, point.clientY);
                    
                    let droppedSuccessfully = false;

                    if (elemBelow) {
                        const dropBox = elemBelow.closest('.drop-box');
                        const startZone = elemBelow.closest('.start-zone');
                        const board = elemBelow.closest('.player-board');

                        // 確保只能放到自己的區域
                        if (board && board.dataset.playerId === dragData.playerId) {
                            if (dropBox) {
                                // 放到方格內
                                if (dropBox.children.length > 0) {
                                    // 方格內已有卡片，進行交換
                                    const existingCard = dropBox.children[0];
                                    const origParent = original.parentElement;
                                    origParent.appendChild(existingCard); // 舊卡片移回來源處
                                }
                                dropBox.appendChild(original); // 新卡片放入方格
                                AudioSys.pop();
                                droppedSuccessfully = true;
                            } else if (startZone) {
                                // 放回預備區
                                startZone.appendChild(original);
                                AudioSys.pop();
                                droppedSuccessfully = true;
                            }
                        }
                    }

                    // 恢復原始卡片顯示
                    original.classList.remove('is-dragging');
                    
                    // 移除分身
                    document.body.removeChild(clone);
                    
                    // 刪除追蹤記錄
                    delete activeDrags[pointerId];
                }
            }
        }

        function submitAnswer(playerId) {
            const pData = GAME_STATE.playersData[playerId - 1];
            const dropZones = document.getElementById(`drop-zones-p${playerId}`);
            const boxes = dropZones.querySelectorAll('.drop-box');
            
            // 檢查是否全部填滿
            let isFull = true;
            let currentAnswer = [];
            
            boxes.forEach(box => {
                if (box.children.length === 0) {
                    isFull = false;
                } else {
                    currentAnswer.push(parseInt(box.children[0].dataset.value));
                }
            });

            if (!isFull) {
                // 未填滿，給予視覺提示 (晃動整個區域)
                dropZones.classList.add('wrong-anim');
                AudioSys.wrong();
                setTimeout(() => dropZones.classList.remove('wrong-anim'), 400);
                return;
            }

            // 驗證答案
            let isCorrect = true;
            for (let i = 0; i < 6; i++) {
                if (currentAnswer[i] !== pData.correctArray[i]) {
                    isCorrect = false;
                    break;
                }
            }

            if (isCorrect) {
                // 答對
                AudioSys.correct();
                pData.score += 10;
                document.getElementById(`score-p${playerId}`).innerText = pData.score;
                
                // 動畫
                dropZones.classList.add('correct-anim');
                setTimeout(() => {
                    dropZones.classList.remove('correct-anim');
                    generateRoundForPlayer(playerId); // 產生下一題
                }, 500);

            } else {
                // 答錯
                AudioSys.wrong();
                pData.score = Math.max(0, pData.score - 5); // 扣分，最低0分
                document.getElementById(`score-p${playerId}`).innerText = pData.score;

                // 錯誤動畫：晃動卡片並退回預備區
                const startZone = document.getElementById(`start-zone-p${playerId}`);
                boxes.forEach(box => {
                    if(box.children.length > 0) {
                        const card = box.children[0];
                        card.classList.add('wrong-anim');
                        setTimeout(() => {
                            card.classList.remove('wrong-anim');
                            startZone.appendChild(card); // 退回
                        }, 400);
                    }
                });
            }
        }

        function tickTimer() {
            GAME_STATE.timeRemaining--;
            updateTimerDisplay();

            if (GAME_STATE.timeRemaining <= 0) {
                endGame();
            }
        }

        function updateTimerDisplay() {
            const m = Math.floor(GAME_STATE.timeRemaining / 60).toString().padStart(2, '0');
            const s = (GAME_STATE.timeRemaining % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
            
            // 最後10秒變紅字
            if (GAME_STATE.timeRemaining <= 10) {
                document.getElementById('timer-display').style.color = '#FF0000';
            } else {
                document.getElementById('timer-display').style.color = '#FF8B94';
            }
        }

        function endGame() {
            clearInterval(GAME_STATE.timerId);
            AudioSys.end();
            
            const resultContainer = document.getElementById('result-container');
            resultContainer.innerHTML = ''; // 清空

            // 依分數排序玩家
            const sortedPlayers = [...GAME_STATE.playersData].sort((a, b) => b.score - a.score);
            const colors = ['var(--color-primary)', 'var(--color-secondary)', 'var(--color-tertiary)'];

            sortedPlayers.forEach((p, index) => {
                const medal = index === 0 ? '👑' : '⭐';
                const row = document.createElement('div');
                row.className = 'result-row';
                // 使用對應的顏色
                row.style.backgroundColor = colors[(p.id - 1) % 3];
                // 為了對比度，將文字變白或深色
                row.style.color = (p.id === 2) ? '#555' : 'white'; 
                row.innerHTML = `<span>${medal} 玩家 ${p.id}</span> <span>${p.score} 分</span>`;
                resultContainer.appendChild(row);
            });

            switchScreen('result-screen');
        }

        function resetToSetup() {
            AudioSys.click();
            switchScreen('setup-screen');
        }

        // 防止 iPad 上的橡皮筋滾動效果
        document.body.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

    </script>
</body>
