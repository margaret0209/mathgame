<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <!-- 確保在 iPad 及行動裝置上能正確自適應縮放，並禁止使用者手動放大縮小畫面 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>比較數字的大小</title>
    
    <style>
        /* ==================================================
           基礎重設與全局設定
           ================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* 防止反白選取文字，讓操作更像原生 App */
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            position: fixed; /* 徹底防止 iOS Safari 橡皮筋捲動效應，確保絕不捲動 */
            overflow: hidden; /* 隱藏捲軸 */
            touch-action: none; /* 禁用預設的觸控手勢 */
        }

        body {
            /* 使用適合學童的圓潤字體 */
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
            background-color: #fdfbf7; /* 柔和米白背景 */
            color: #4a4a4a; /* 深灰色文字 */
            --num-font-size: min(8vw, 10vh); /* 動態調整數字方塊字體大小 */
        }

        /* 畫面容器：用於切換設定畫面與遊戲畫面 */
        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2vh 2vw;
        }
        .screen.active {
            display: flex;
        }

        /* ==================================================
           設定畫面樣式 (Setup Screen)
           ================================================== */
        #setup-screen {
            background-color: #fdfbf7;
            overflow-y: auto;
        }

        .setup-panel {
            background: white;
            padding: 3vh 3vw;
            border-radius: 3vh;
            box-shadow: 0 1vh 3vh rgba(0,0,0,0.05);
            text-align: center;
            width: 90vw;
            max-width: 650px;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
        }

        .setup-panel h1 {
            color: #ffb7b2; /* 馬卡龍粉紅 */
            margin-bottom: 2vh;
            font-size: clamp(1.8rem, 4.5vw, 2.8rem);
            text-shadow: 0.2vh 0.2vh 0px #ffe5e5;
        }

        .form-group {
            margin-bottom: 1.5vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: clamp(1.1rem, 2.5vw, 1.5rem);
            font-weight: bold;
            color: #666;
        }

        .form-group select {
            font-size: clamp(1rem, 2vw, 1.3rem);
            padding: 0.8vh 1vw;
            border-radius: 1.5vh;
            border: 0.3vh solid #e2e2e2;
            background: #fcfcfc;
            margin-left: 1vw;
            font-family: inherit;
            color: #555;
            outline: none;
            width: 50%;
            text-align: center;
        }

        /* 玩家姓名設定區塊 */
        #player-names-container {
            background-color: #faf6f0;
            border-radius: 2vh;
            padding: 1.5vh 2vw;
            margin-bottom: 1.5vh;
            display: flex;
            flex-direction: column;
            gap: 1vh;
        }

        .player-name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: clamp(1rem, 2.2vw, 1.3rem);
            color: #555;
            font-weight: bold;
        }

        .player-name-row select {
            width: 55%;
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            padding: 0.6vh 1vw;
            border-radius: 1.2vh;
            border: 0.2vh solid #d1d1d1;
            background: white;
            text-align: center;
        }

        /* 按鈕容器 */
        .btn-group {
            display: flex;
            gap: 2vw;
            justify-content: center;
            margin-top: 1vh;
        }

        /* 共用按鈕樣式 */
        .btn {
            font-size: clamp(1.3rem, 3.5vw, 1.8rem);
            padding: 1.2vh 3vw;
            border: none;
            border-radius: 2.5vh;
            background-color: #ffb7b2;
            color: white;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0.8vh 0 #ff9aa2;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active {
            transform: translateY(0.8vh);
            box-shadow: 0 0 0 #ff9aa2;
        }

        .btn-secondary {
            background-color: #a1c9f1;
            box-shadow: 0 0.8vh 0 #89b3df;
        }
        .btn-secondary:active {
            box-shadow: 0 0 0 #89b3df;
        }
        
        /* ==================================================
           遊戲畫面樣式 (Game Screen)
           ================================================== */
        #game-screen {
            justify-content: flex-start;
            padding: 0;
        }

        /* 頂部計時器 */
        #timer-bar {
            width: 100%;
            height: 8vh;
            background-color: #e8fccf;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(1.2rem, 3vh, 2rem);
            font-weight: bold;
            box-shadow: 0 0.5vh 1.5vh rgba(0,0,0,0.05);
            z-index: 10;
        }
        #time-left {
            color: #ff7b7b;
            margin: 0 1vw;
            font-size: clamp(1.5rem, 4vh, 2.5rem);
            min-width: 12vw;
            text-align: center;
        }

        /* 遊戲主區域：橫向排列多個玩家 */
        #game-area {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 92vh;
            padding: 1.2vh 1vw;
            gap: 1vw;
        }

        /* 單一玩家區域 */
        .player-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-radius: 2vh;
            border: 0.4vh solid rgba(255,255,255,0.8);
            padding: 1vh 0.8vw;
            box-shadow: 0 1vh 2vh rgba(0,0,0,0.05);
            position: relative;
            min-width: 0; /* 防止子元素溢出 */
        }

        .player-header {
            text-align: center;
            margin-bottom: 0.8vh;
            background: rgba(255,255,255,0.65);
            border-radius: 1.5vh;
            padding: 0.5vh;
        }
        .player-header h2 { 
            font-size: clamp(1.1rem, 2.8vh, 1.8rem); 
            margin: 0; 
            color: #555; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .score-display { 
            font-size: clamp(0.9rem, 2.2vh, 1.4rem); 
            font-weight: bold; 
            color: #4a4a4a; 
            margin-top: 0.3vh;
        }

        .game-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            width: 100%;
        }

        /* 第一行：數字與答案空白框 */
        .question-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 2%; 
            width: 100%;
            height: 14vh;
        }

        /* 數字方塊 */
        .num-box {
            flex: 2; 
            max-width: 42%;
            height: 100%;
            background: white;
            border-radius: 1.5vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: 0 0.5vh 1vh rgba(0,0,0,0.1);
            font-size: var(--num-font-size);
            color: #555;
            padding: 0 0.5vw;
            overflow: hidden;
            white-space: nowrap;
        }

        /* 答案放置區 */
        .drop-zone {
            flex: 1;
            max-width: 25%;
            height: 100%;
            border: 0.4vh dashed #ccc;
            background: rgba(255,255,255,0.8);
            border-radius: 1.5vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ccc;
            font-size: clamp(1.5rem, 5vh, 3.5rem);
            font-weight: bold;
            transition: all 0.2s;
        }
        .drop-zone.filled {
            border-style: solid;
            border-color: #ffb7b2;
            color: #ff7b7b;
            background: white;
            box-shadow: 0 0.5vh 1vh rgba(0,0,0,0.1);
        }

        /* 第二行：可拖拉符號 */
        .symbols-row {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 1.5vw;
            width: 100%;
            height: 11vh;
        }

        .draggable-symbol {
            width: 11vh;
            height: 100%;
            max-width: 30%;
            background: white;
            border-radius: 1.5vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(1.8rem, 5vh, 3.5rem);
            font-weight: bold;
            color: #6bb9f0;
            box-shadow: 0 0.8vh 0 #89b3df, 0 1vh 1.5vh rgba(0,0,0,0.1);
            cursor: grab;
            touch-action: none;
        }
        .draggable-symbol:active { cursor: grabbing; }

        /* 拖拉中的分身 */
        .draggable-symbol.dragging-clone {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -120%);
            margin: 0 !important;
            opacity: 0.95;
            box-shadow: 0 1.5vh 2.5vh rgba(0,0,0,0.2);
            width: 11vh;
            height: 11vh;
        }

        /* 提交按鈕 */
        .submit-btn {
            font-size: clamp(1.1rem, 2.8vh, 1.8rem);
            padding: 0.8vh 1.5vw;
            height: 7.5vh;
            border: none;
            border-radius: 2vh;
            background-color: #c8b6ff;
            color: white;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0.8vh 0 #b3a0eb;
            transition: all 0.1s;
            width: 85%;
            max-width: 220px;
        }
        .submit-btn:active:not(:disabled) {
            transform: translateY(0.8vh);
            box-shadow: 0 0 0 #b3a0eb;
        }
        .submit-btn:disabled {
            background-color: #dcdcdc;
            box-shadow: 0 0.8vh 0 #bfbfbf;
            cursor: not-allowed;
            color: #888;
        }

        /* 對錯回饋文字 */
        .feedback-msg {
            font-size: clamp(0.9rem, 2.2vh, 1.3rem);
            font-weight: bold;
            height: 3.5vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .feedback-msg.correct { color: #5cb85c; animation: pop 0.4s; }
        .feedback-msg.wrong { color: #d9534f; animation: shake 0.4s; }
        .feedback-msg.warning { color: #f0ad4e; }

        /* ==================================================
           結算畫面樣式 (Result Screen)
           ================================================== */
        #result-screen { background-color: #fdfbf7; }
        .result-panel {
            background: white;
            padding: 4vh 3vw;
            border-radius: 3vh;
            box-shadow: 0 1vh 3vh rgba(0,0,0,0.05);
            text-align: center;
            width: 95vw;
            max-width: 900px;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .result-panel h2 {
            color: #a1c9f1;
            font-size: clamp(2rem, 5vw, 3.2rem);
            margin-bottom: 3vh;
        }

        /* 橫向並排成績卡片 */
        #results-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 2vw;
            width: 100%;
            margin-bottom: 3vh;
            min-height: 25vh;
        }

        .result-col {
            flex: 1;
            max-width: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3vh 1vw;
            border-radius: 2vh;
            box-shadow: 0 1vh 2vh rgba(0,0,0,0.05);
            transition: transform 0.3s;
            border: 0.4vh solid transparent;
        }

        .result-col .player-name {
            font-size: clamp(1.1rem, 3vw, 1.8rem);
            margin-bottom: 1.5vh;
            color: #555;
            font-weight: bold;
            word-break: break-all;
        }

        .result-col .player-score {
            font-size: clamp(1.8rem, 4.5vw, 3rem);
            color: #4a4a4a;
            font-weight: bold;
        }

        .result-col.winner {
            transform: scale(1.12);
            box-shadow: 0 0 2vh rgba(255, 215, 0, 0.6), 0 1vh 3vh rgba(0,0,0,0.1);
            border-color: #ffd700;
            z-index: 2;
        }
        
        .result-col.winner .player-name,
        .result-col.winner .player-score {
            color: #d9534f;
        }

        /* ==================================================
           排行榜 Modal 樣式 (Leaderboard Modal)
           ================================================== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.4);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            width: 90vw;
            max-width: 600px;
            max-height: 85vh;
            border-radius: 3vh;
            padding: 3vh 3vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 1vh 4vh rgba(0,0,0,0.2);
        }

        .modal-content h2 {
            color: #ffb7b2;
            font-size: clamp(1.6rem, 4vw, 2.5rem);
            margin-bottom: 1.5vh;
        }

        .lb-filter-bar {
            display: flex;
            gap: 2vw;
            margin-bottom: 2vh;
            width: 100%;
            justify-content: center;
        }

        .lb-filter-bar select {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            padding: 0.8vh 1vw;
            border-radius: 1vh;
            border: 0.2vh solid #ccc;
            outline: none;
            font-family: inherit;
        }

        .lb-list {
            width: 100%;
            flex: 1;
            overflow-y: auto;
            border: 0.2vh solid #eee;
            border-radius: 1.5vh;
            padding: 1vh 1vw;
            margin-bottom: 2vh;
            background: #fdfbf7;
        }

        .lb-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2vh 2vw;
            border-bottom: 0.1vh solid #ececec;
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            font-weight: bold;
            color: #555;
        }
        .lb-item:last-child { border-bottom: none; }
        .lb-rank {
            width: 15%;
            color: #aaa;
        }
        .lb-rank.top-1 { color: #ffd700; font-size: 1.2em; }
        .lb-rank.top-2 { color: #c0c0c0; font-size: 1.1em; }
        .lb-rank.top-3 { color: #cd7f32; font-size: 1.05em; }
        .lb-name { flex: 1; text-align: left; }
        .lb-score { color: #ff7b7b; }

        /* 動畫 */
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }
    </style>
</head>
<body>

    <!-- 設定畫面 -->
    <div id="setup-screen" class="screen active">
        <div class="setup-panel">
            <h1>比較數字的大小</h1>
            
            <div class="form-group">
                <label for="setting-digits">數字類型：</label>
                <select id="setting-digits">
                    <option value="2">兩位數</option>
                    <option value="3">三位數</option>
                    <option value="4">四位數</option>
                    <option value="5">五位數</option>
                    <option value="6">六位數</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="setting-players">遊玩人數：</label>
                <select id="setting-players" onchange="renderPlayerNameInputs()">
                    <option value="1">1 人</option>
                    <option value="2" selected>2 人</option>
                    <option value="3">3 人</option>
                    <option value="4">4 人</option>
                </select>
            </div>

            <!-- 動態生成玩家姓名選單區塊 -->
            <div id="player-names-container"></div>
            
            <div class="form-group">
                <label for="setting-time">遊戲時限：</label>
                <select id="setting-time">
                    <option value="1">1 分鐘</option>
                    <option value="3">3 分鐘</option>
                    <option value="5">5 分鐘</option>
                </select>
            </div>
            
            <div class="btn-group">
                <button class="btn" onclick="startGame()">開始遊戲</button>
                <button class="btn btn-secondary" onclick="openLeaderboardModal()">🏆 排行榜</button>
            </div>
        </div>
    </div>

    <!-- 遊戲畫面 -->
    <div id="game-screen" class="screen">
        <div id="timer-bar">剩餘時間：<span id="time-left">0:00</span></div>
        <div id="game-area">
            <!-- 玩家欄位將透過 JavaScript 動態生成 -->
        </div>
    </div>

    <!-- 結算畫面 -->
    <div id="result-screen" class="screen">
        <div class="result-panel">
            <h2>遊戲結束</h2>
            <div id="results-container">
                <!-- 成績列表將插入此處 -->
            </div>
            <div class="btn-group">
                <button class="btn" onclick="restartToMenu()">回到首頁</button>
                <button class="btn btn-secondary" onclick="openLeaderboardModal()">🏆 排行榜</button>
            </div>
        </div>
    </div>

    <!-- 排行榜 Modal -->
    <div id="leaderboard-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>🏆 排行榜 (TOP 10)</h2>
            <div class="lb-filter-bar">
                <select id="lb-filter-digits" onchange="renderLeaderboardList()">
                    <option value="2">兩位數</option>
                    <option value="3">三位數</option>
                    <option value="4">四位數</option>
                    <option value="5">五位數</option>
                    <option value="6">六位數</option>
                </select>
                <select id="lb-filter-time" onchange="renderLeaderboardList()">
                    <option value="1">1 分鐘</option>
                    <option value="3">3 分鐘</option>
                    <option value="5">5 分鐘</option>
                </select>
            </div>
            <div class="lb-list" id="lb-list-content">
                <!-- 動態生成排行資料 -->
            </div>
            <button class="btn btn-secondary" onclick="closeLeaderboardModal()">關閉</button>
        </div>
    </div>

    <script>
        /* ==================================================
           全域變數設定
           ================================================== */
        let gameInterval = null;
        let timeLeft = 0;
        let playersData = [];
        let numDigits = 2;
        
        // 預設學生名字清單
        const PRESET_NAMES = ['譽', '俊朗', '啟浚', '謙', '寶', '麟', '翔', '思', '嘉朗', '晴', '鵬'];

        // 分配給 1~4 名玩家的馬卡龍背景色（粉紅、淺藍、淺綠、淺黃）
        const playerColors = ['#ffe5ec', '#e0fbfc', '#e8fccf', '#fcf6bd'];

        /* ==================================================
           離線排行榜資料儲存 (支持 LocalStorage 與 Memory 備援)
           ================================================== */
        let leaderboards = {};

        function loadLeaderboards() {
            try {
                const stored = localStorage.getItem('math_game_leaderboards');
                if (stored) leaderboards = JSON.parse(stored);
            } catch (e) {
                console.log("Memory mode active");
            }
        }

        function saveLeaderboards() {
            try {
                localStorage.setItem('math_game_leaderboards', JSON.stringify(leaderboards));
            } catch (e) {}
        }

        // 更新特定難度分類下的玩家最高分數
        function updateScoreInLeaderboard(digits, time, playerName, score) {
            const key = `${digits}digits_${time}min`;
            if (!leaderboards[key]) leaderboards[key] = [];

            const list = leaderboards[key];
            const existingIndex = list.findIndex(item => item.name === playerName);

            if (existingIndex !== -1) {
                // 每位玩家只保留最高分的一筆紀錄
                if (score > list[existingIndex].score) {
                    list[existingIndex].score = score;
                }
            } else {
                list.push({ name: playerName, score: score });
            }

            // 依分數高至低排序，並只保留前 10 名
            list.sort((a, b) => b.score - a.score);
            leaderboards[key] = list.slice(0, 10);
            saveLeaderboards();
        }

        /* ==================================================
           音效系統 (Web Audio API)
           ================================================== */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                osc.frequency.setValueAtTime(1046.50, now + 0.3);
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.5, now + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(250, now);
                osc.frequency.linearRampToValueAtTime(150, now + 0.3);
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.5, now + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'click' || type === 'drop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.3, now + 0.02);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'finish') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.2);
                osc.frequency.setValueAtTime(659.25, now + 0.4);
                osc.frequency.setValueAtTime(880, now + 0.6);
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.3, now + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 1.2);
                osc.start(now);
                osc.stop(now + 1.2);
            }
        }

        /* ==================================================
           設定畫面與姓名選單動態生成
           ================================================== */
        function renderPlayerNameInputs() {
            const count = parseInt(document.getElementById('setting-players').value);
            const container = document.getElementById('player-names-container');
            container.innerHTML = '';

            for (let i = 0; i < count; i++) {
                const row = document.createElement('div');
                row.className = 'player-name-row';
                
                let optionsHtml = '';
                PRESET_NAMES.forEach((name, idx) => {
                    const selected = (idx === i % PRESET_NAMES.length) ? 'selected' : '';
                    optionsHtml += `<option value="${name}" ${selected}>${name}</option>`;
                });

                row.innerHTML = `
                    <label for="select-player-name-${i}">玩家 ${i + 1} 名字：</label>
                    <select id="select-player-name-${i}">
                        ${optionsHtml}
                    </select>
                `;
                container.appendChild(row);
            }
        }

        /* ==================================================
           遊戲初始化與畫面控制
           ================================================== */
        function startGame() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            playSound('click');

            numDigits = parseInt(document.getElementById('setting-digits').value);
            const numPlayers = parseInt(document.getElementById('setting-players').value);
            const timeMins = parseInt(document.getElementById('setting-time').value);
            
            timeLeft = timeMins * 60;
            playersData = [];

            // 讀取每位玩家選擇的名字
            for (let i = 0; i < numPlayers; i++) {
                const nameSelect = document.getElementById(`select-player-name-${i}`);
                const name = nameSelect ? nameSelect.value : `玩家 ${i + 1}`;
                playersData.push({
                    id: i,
                    name: name,
                    score: 0,
                    currentQuestion: null
                });
            }

            // 動態調整 1~4 人模式下的數字字體大小
            let fontSizeVW = 8;
            if (numPlayers === 4) {
                fontSizeVW = (numDigits >= 5) ? 1.8 : (numDigits >= 4 ? 2.2 : 2.8);
            } else if (numPlayers === 3) {
                fontSizeVW = (numDigits >= 5) ? 2.5 : (numDigits >= 4 ? 3.0 : 3.5);
            } else if (numPlayers === 2) {
                fontSizeVW = (numDigits >= 5) ? 4.0 : (numDigits >= 4 ? 4.5 : 5.5);
            } else {
                fontSizeVW = (numDigits >= 5) ? 7.0 : 9.0;
            }
            document.documentElement.style.setProperty('--num-font-size', `min(${fontSizeVW}vw, 9vh)`);

            // 切換畫面
            document.getElementById('setup-screen').classList.remove('active');
            document.getElementById('game-screen').classList.add('active');

            // 生成遊戲區域
            const gameArea = document.getElementById('game-area');
            gameArea.innerHTML = '';

            for (let i = 0; i < numPlayers; i++) {
                const col = document.createElement('div');
                col.className = 'player-col';
                col.style.backgroundColor = playerColors[i];
                col.innerHTML = `
                    <div class="player-header">
                        <h2>${playersData[i].name}</h2>
                        <div class="score-display">分數: <span id="score-${i}">0</span></div>
                    </div>
                    <div class="game-content">
                        <div class="question-row">
                            <div class="num-box" id="num1-${i}"></div>
                            <div class="drop-zone" id="drop-${i}" data-player="${i}" data-filled="">?</div>
                            <div class="num-box" id="num2-${i}"></div>
                        </div>
                        <div class="symbols-row">
                            <div class="draggable-symbol" data-value="&gt;" data-player="${i}">&gt;</div>
                            <div class="draggable-symbol" data-value="=" data-player="${i}">=</div>
                            <div class="draggable-symbol" data-value="&lt;" data-player="${i}">&lt;</div>
                        </div>
                        <button class="submit-btn" id="submit-${i}" onclick="checkAnswer(${i})">提交</button>
                        <div class="feedback-msg" id="feedback-${i}"></div>
                    </div>
                `;
                gameArea.appendChild(col);
            }

            // 初始化觸控拖拉事件
            document.querySelectorAll('.draggable-symbol').forEach(el => initTouchDrag(el));

            // 生成題目
            for (let i = 0; i < numPlayers; i++) {
                generateNewQuestion(i);
            }

            // 啟動計時器
            updateTimerDisplay();
            clearInterval(gameInterval);
            gameInterval = setInterval(timerTick, 1000);
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft / 60);
            const s = Math.floor(timeLeft % 60);
            document.getElementById('time-left').innerText = m + ':' + (s < 10 ? '0' : '') + s;
        }

        function timerTick() {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                endGame();
            }
        }

        /* ==================================================
           題目生成與答題邏輯
           ================================================== */
        function generateQuestion(digits) {
            const min = Math.pow(10, digits - 1);
            const max = Math.pow(10, digits) - 1;
            
            const num1 = Math.floor(Math.random() * (max - min + 1)) + min;
            let num2;
            
            if (Math.random() < 0.15) {
                num2 = num1;
            } else {
                num2 = Math.floor(Math.random() * (max - min + 1)) + min;
                while (num1 === num2) {
                    num2 = Math.floor(Math.random() * (max - min + 1)) + min;
                }
            }
            return { num1, num2 };
        }

        function generateNewQuestion(playerIdx) {
            const q = generateQuestion(numDigits);
            playersData[playerIdx].currentQuestion = q;
            
            document.getElementById(`num1-${playerIdx}`).innerText = q.num1;
            document.getElementById(`num2-${playerIdx}`).innerText = q.num2;
            
            const dropZone = document.getElementById(`drop-${playerIdx}`);
            dropZone.innerHTML = '?';
            dropZone.setAttribute('data-filled', '');
            dropZone.classList.remove('filled');
            
            const feedback = document.getElementById(`feedback-${playerIdx}`);
            feedback.innerText = '';
            feedback.className = 'feedback-msg';
            
            document.getElementById(`submit-${playerIdx}`).disabled = false;
        }

        function checkAnswer(playerIdx) {
            const btn = document.getElementById(`submit-${playerIdx}`);
            if (btn.disabled) return;
            
            const dropZone = document.getElementById(`drop-${playerIdx}`);
            const userAnswer = dropZone.getAttribute('data-filled');
            
            if (!userAnswer) {
                playSound('wrong');
                showFeedback(playerIdx, '請先拖拉符號！', 'warning');
                return;
            }
            
            btn.disabled = true;
            
            const q = playersData[playerIdx].currentQuestion;
            let correctAnswer = '';
            if (q.num1 > q.num2) correctAnswer = '>';
            else if (q.num1 === q.num2) correctAnswer = '=';
            else correctAnswer = '<';
            
            if (userAnswer === correctAnswer) {
                playSound('correct');
                playersData[playerIdx].score += 10;
                document.getElementById(`score-${playerIdx}`).innerText = playersData[playerIdx].score;
                showFeedback(playerIdx, '答對了！ +10分', 'correct');
                
                setTimeout(() => {
                    if (timeLeft > 0) generateNewQuestion(playerIdx);
                }, 1200);
            } else {
                playSound('wrong');
                playersData[playerIdx].score = Math.max(0, playersData[playerIdx].score - 5);
                document.getElementById(`score-${playerIdx}`).innerText = playersData[playerIdx].score;
                showFeedback(playerIdx, '答錯扣5分，請重試！', 'wrong');
                
                setTimeout(() => {
                    if (timeLeft > 0) {
                        dropZone.innerHTML = '?';
                        dropZone.setAttribute('data-filled', '');
                        dropZone.classList.remove('filled');
                        showFeedback(playerIdx, '', '');
                        btn.disabled = false;
                    }
                }, 1500);
            }
        }

        function showFeedback(playerIdx, text, type) {
            const feedback = document.getElementById(`feedback-${playerIdx}`);
            feedback.innerText = text;
            feedback.className = 'feedback-msg ' + type;
        }

        /* ==================================================
           觸控拖放系統 (多點觸控與滑鼠通用)
           ================================================== */
        let activeTouches = {};
        let globalTouchInitialized = false;

        function initTouchDrag(el) {
            el.addEventListener('mousedown', handleDragStart, {passive: false});
            el.addEventListener('touchstart', handleDragStart, {passive: false});
            
            if (!globalTouchInitialized) {
                document.addEventListener('mousemove', handleDragMove, {passive: false});
                document.addEventListener('touchmove', handleDragMove, {passive: false});
                document.addEventListener('mouseup', handleDragEnd);
                document.addEventListener('touchend', handleDragEnd);
                document.addEventListener('touchcancel', handleDragEnd);
                globalTouchInitialized = true;
            }
        }

        function handleDragStart(e) {
            if (e.type === 'touchstart') {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    startDrag(e.changedTouches[i], this, e);
                }
            } else {
                if (e.button !== 0) return;
                startDrag(e, this, e);
            }
        }

        function startDrag(point, el, originalEvent) {
            originalEvent.preventDefault();
            playSound('click');
            
            const id = point.identifier !== undefined ? point.identifier : 'mouse';
            
            const clone = el.cloneNode(true);
            clone.classList.add('dragging-clone');
            document.body.appendChild(clone);
            
            updateClonePosition(clone, point.clientX, point.clientY);
            
            activeTouches[id] = {
                clone: clone,
                value: el.getAttribute('data-value'),
                playerIndex: el.getAttribute('data-player')
            };
        }

        function handleDragMove(e) {
            if (e.type === 'touchmove') {
                let moved = false;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const id = e.changedTouches[i].identifier;
                    if (activeTouches[id]) {
                        updateClonePosition(activeTouches[id].clone, e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                        moved = true;
                    }
                }
                if (moved && e.cancelable) e.preventDefault(); 
            } else {
                if (activeTouches['mouse']) {
                    updateClonePosition(activeTouches['mouse'].clone, e.clientX, e.clientY);
                    if (e.cancelable) e.preventDefault();
                }
            }
        }

        function updateClonePosition(clone, x, y) {
            clone.style.left = x + 'px';
            clone.style.top = y + 'px';
        }

        function handleDragEnd(e) {
            if (e.type.startsWith('touch')) {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const id = e.changedTouches[i].identifier;
                    if (activeTouches[id]) {
                        endDrag(id, e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                    }
                }
            } else {
                if (activeTouches['mouse']) {
                    endDrag('mouse', e.clientX, e.clientY);
                }
            }
        }

        function endDrag(id, x, y) {
            const dragState = activeTouches[id];
            const clone = dragState.clone;
            
            clone.style.display = 'none';
            const dropTarget = document.elementFromPoint(x, y);
            clone.style.display = 'flex';
            
            if (dropTarget) {
                const dropZone = dropTarget.closest('.drop-zone');
                if (dropZone && dropZone.getAttribute('data-player') === dragState.playerIndex) {
                    dropZone.innerHTML = dragState.value;
                    dropZone.setAttribute('data-filled', dragState.value);
                    dropZone.classList.add('filled');
                    playSound('drop');
                }
            }
            
            clone.remove();
            delete activeTouches[id];
        }

        /* ==================================================
           遊戲結束與排行榜更新
           ================================================== */
        function endGame() {
            clearInterval(gameInterval);
            playSound('finish');
            
            const timeMins = parseInt(document.getElementById('setting-time').value);

            // 更新每位玩家的排行榜數據 (獨立儲存不同難度與時限)
            playersData.forEach(p => {
                updateScoreInLeaderboard(numDigits, timeMins, p.name, p.score);
            });

            document.getElementById('game-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');
            
            const resultsContainer = document.getElementById('results-container');
            resultsContainer.innerHTML = '';
            
            let maxScore = -1;
            playersData.forEach(p => {
                if (p.score > maxScore) maxScore = p.score;
            });
            
            playersData.forEach(p => {
                const col = document.createElement('div');
                col.className = 'result-col';
                col.style.backgroundColor = playerColors[p.id];
                
                let crown = '';
                if (p.score === maxScore && p.score > 0) {
                    col.classList.add('winner');
                    crown = '👑 ';
                }
                
                col.innerHTML = `
                    <div class="player-name">${crown}${p.name}</div>
                    <div class="player-score">${p.score} 分</div>
                `;
                resultsContainer.appendChild(col);
            });
        }

        function restartToMenu() {
            playSound('click');
            document.getElementById('result-screen').classList.remove('active');
            document.getElementById('setup-screen').classList.add('active');
        }

        /* ==================================================
           排行榜 Modal 邏輯
           ================================================== */
        function openLeaderboardModal() {
            playSound('click');
            
            // 預設將選單設為當前設定的難度與時限
            const currentDigits = document.getElementById('setting-digits').value;
            const currentTime = document.getElementById('setting-time').value;
            
            document.getElementById('lb-filter-digits').value = currentDigits;
            document.getElementById('lb-filter-time').value = currentTime;
            
            renderLeaderboardList();
            document.getElementById('leaderboard-modal').classList.add('active');
        }

        function closeLeaderboardModal() {
            playSound('click');
            document.getElementById('leaderboard-modal').classList.remove('active');
        }

        function renderLeaderboardList() {
            const digits = document.getElementById('lb-filter-digits').value;
            const time = document.getElementById('lb-filter-time').value;
            const key = `${digits}digits_${time}min`;
            
            const listContainer = document.getElementById('lb-list-content');
            listContainer.innerHTML = '';

            const list = leaderboards[key] || [];

            if (list.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; color:#aaa; padding: 4vh;">暫無紀錄</div>';
                return;
            }

            list.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'lb-item';
                
                let rankClass = '';
                let medal = index + 1;
                if (index === 0) { rankClass = 'top-1'; medal = '🥇 1'; }
                else if (index === 1) { rankClass = 'top-2'; medal = '🥈 2'; }
                else if (index === 2) { rankClass = 'top-3'; medal = '🥉 3'; }

                row.innerHTML = `
                    <div class="lb-rank ${rankClass}">${medal}</div>
                    <div class="lb-name">${item.name}</div>
                    <div class="lb-score">${item.score} 分</div>
                `;
                listContainer.appendChild(row);
            });
        }

        // 頁面載入後自動初始化選單與排行榜
        window.onload = function() {
            loadLeaderboards();
            renderPlayerNameInputs();
        };
    </script>
</body>
