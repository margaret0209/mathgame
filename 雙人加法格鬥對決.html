<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雙人加法格鬥對決 (Math Combat Showdown)</title>
    <style>
        :root {
            --bg-color: #0b0c14;
            --panel-p1: #1a2238;
            --panel-p2: #381a1f;
            --accent-p1: #2980b9;
            --accent-p2: #c0392b;
            --hp-green: #2ecc71;
            --hp-yellow: #f1c40f;
            --hp-red: #e74c3c;
            --energy-gold: #f39c12;
            --text-dark: #222222;
            --carry-bg: #ffeaa7;
            --active-border: #ff7675;
            --wrong-color: #d63031;
            --correct-color: #00b894;

            /* 直式的高度 : 數字鍵盤的高度 = 2 : 1 比例變數 */
            --math-col-height: clamp(230px, 34vh, 290px);
            --numpad-height: calc(var(--math-col-height) / 2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        html, body {
            background-color: var(--bg-color);
            height: 100%;
            width: 100%;
            font-family: "Comic Sans MS", "Arial Rounded MT Bold", "PingFang HK", "Microsoft JhengHei", sans-serif;
            color: #fff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 頂部控制列 */
        #top-bar {
            background-color: rgba(14, 16, 26, 0.95);
            padding: 4px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2f3640;
            z-index: 100;
            flex-shrink: 0;
            height: 38px;
        }

        .logo {
            font-size: 1.05rem;
            font-weight: 900;
            color: #f1c40f;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
        }

        .battle-rules-tip {
            font-size: 0.76rem;
            color: #bdc3c7;
            background: rgba(0, 0, 0, 0.45);
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .battle-rules-tip span {
            color: #f39c12;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.12);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .control-group label {
            font-size: 0.76rem;
            font-weight: bold;
        }

        select {
            font-size: 0.76rem;
            padding: 2px 5px;
            border-radius: 5px;
            border: none;
            outline: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }

        .btn-restart {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.78rem;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(231, 76, 60, 0.4);
            transition: transform 0.1s;
        }

        .btn-restart:active { transform: scale(0.95); }

        /* ==========================================
           格鬥對決 HUD：血條、能量與打鬥動畫
           ========================================== */
        #combat-hud {
            flex-shrink: 0;
            background: radial-gradient(circle at 50% 30%, #1f2738 0%, #0d101a 100%);
            border-bottom: 3px solid #f39c12;
            padding: 5px 16px 6px 16px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 25px rgba(0,0,0,0.7);
            overflow: hidden;
        }

        #combat-hud::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                linear-gradient(90deg, rgba(52, 152, 219, 0.12) 0%, transparent 40%, transparent 60%, rgba(231, 76, 60, 0.12) 100%),
                radial-gradient(ellipse at 50% 100%, rgba(243, 156, 18, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        .stage-floor {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 16px;
            background: linear-gradient(to bottom, #2c3e50, #1a252f);
            border-top: 2px solid #576574;
            box-shadow: 0 -3px 10px rgba(0,0,0,0.5);
            z-index: 1;
        }

        .floor-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,255,255,0.06) 40px, rgba(255,255,255,0.06) 42px);
        }

        .hp-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            width: 100%;
            z-index: 5;
        }

        .fighter-hp-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .fighter-info-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 0.85rem;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .fighter-p1-label {
            color: #54a0ff;
            text-shadow: 0 0 10px rgba(84, 160, 255, 0.6);
        }
        .fighter-p2-label {
            color: #ff6b6b;
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.6);
        }

        .hp-bar-bg {
            height: 16px;
            background-color: #1e272e;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #718093;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8), 0 0 8px rgba(0,0,0,0.5);
            position: relative;
        }

        .hp-bar-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(180deg, #2ed573 0%, #10ac84 100%);
            box-shadow: 0 0 10px rgba(46, 213, 115, 0.6);
            transition: width 0.35s cubic-bezier(0.25, 1, 0.5, 1), background 0.3s;
        }

        .p2-hp-fill { float: right; }

        .energy-bar-bg {
            height: 6px;
            background: #1e272e;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #576574;
        }

        .energy-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f1c40f, #e67e22);
            box-shadow: 0 0 6px rgba(241, 196, 15, 0.6);
            transition: width 0.3s;
        }

        .vs-badge {
            font-size: 1.25rem;
            font-weight: 900;
            font-style: italic;
            color: #f1c40f;
            text-shadow: 0 0 12px rgba(241, 196, 15, 0.8), 0 0 20px #e67e22;
            flex-shrink: 0;
            padding: 0 4px;
            animation: pulse-vs 1.2s infinite alternate ease-in-out;
        }

        @keyframes pulse-vs {
            0% { transform: scale(0.95); }
            100% { transform: scale(1.1); filter: brightness(1.2); }
        }

        .fighters-stage {
            height: clamp(72px, 12vh, 105px);
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 clamp(30px, 7vw, 85px);
            position: relative;
            z-index: 5;
            margin-bottom: 2px;
        }

        .fighter-avatar-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
            transition: transform 0.15s ease-out;
        }

        .fighter-char {
            font-size: clamp(2.8rem, 4.8vw, 3.8rem);
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.8));
            position: relative;
            line-height: 1;
            transition: transform 0.12s;
        }

        .fighter-shadow {
            width: clamp(35px, 4.5vw, 55px);
            height: 8px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            margin-top: -3px;
            filter: blur(2px);
        }

        .fighter-tag-name {
            font-size: 0.7rem;
            font-weight: 900;
            padding: 2px 7px;
            border-radius: 7px;
            margin-top: 2px;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        .tag-p1-bg {
            background: linear-gradient(135deg, #2e86de, #0984e3);
            border: 1px solid #74b9ff;
            color: #fff;
        }
        .tag-p2-bg {
            background: linear-gradient(135deg, #ee5253, #d63031);
            border: 1px solid #ff7675;
            color: #fff;
        }

        .damage-popup {
            position: absolute;
            top: -22px;
            font-size: 1.45rem;
            font-weight: 900;
            color: #ff4757;
            text-shadow: 0 0 6px #000, 0 0 12px #ff4757, 0 0 20px #e74c3c;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease-out;
            white-space: nowrap;
            z-index: 100;
        }

        .damage-popup.crit {
            color: #f1c40f;
            font-size: 1.85rem;
            text-shadow: 0 0 8px #000, 0 0 15px #f39c12, 0 0 28px #e67e22;
        }

        .damage-popup.super {
            color: #a55eea;
            font-size: 2.1rem;
            text-shadow: 0 0 10px #000, 0 0 20px #8854d0, 0 0 35px #3867d6;
        }

        .damage-popup.show {
            transform: translateY(-35px) scale(1.2);
            opacity: 1;
        }

        @keyframes dash-punch-p1 {
            0% { transform: translateX(0) scale(1); }
            35% { transform: translateX(clamp(45px, 9vw, 95px)) scale(1.2) rotate(8deg); }
            100% { transform: translateX(0) scale(1); }
        }

        @keyframes dash-punch-p2 {
            0% { transform: translateX(0) scale(1); }
            35% { transform: translateX(calc(-1 * clamp(45px, 9vw, 95px))) scale(1.2) rotate(-8deg); }
            100% { transform: translateX(0) scale(1); }
        }

        .char-dash-p1 { animation: dash-punch-p1 0.36s cubic-bezier(0.2, 0.9, 0.3, 1.2); }
        .char-dash-p2 { animation: dash-punch-p2 0.36s cubic-bezier(0.2, 0.9, 0.3, 1.2); }

        @keyframes hit-knockback-p1 {
            0% { transform: translateX(0); filter: brightness(1); }
            20% { transform: translateX(-20px) scale(0.92) rotate(-10deg); filter: brightness(2.5) saturate(2); }
            45% { transform: translateX(10px) rotate(4deg); }
            70% { transform: translateX(-5px); }
            100% { transform: translateX(0); filter: brightness(1); }
        }

        @keyframes hit-knockback-p2 {
            0% { transform: translateX(0); filter: brightness(1); }
            20% { transform: translateX(20px) scale(0.92) rotate(10deg); filter: brightness(2.5) saturate(2); }
            45% { transform: translateX(-10px) rotate(-4deg); }
            70% { transform: translateX(5px); }
            100% { transform: translateX(0); filter: brightness(1); }
        }

        .char-hit-p1 { animation: hit-knockback-p1 0.42s ease-out; }
        .char-hit-p2 { animation: hit-knockback-p2 0.42s ease-out; }

        .energy-wave {
            position: absolute;
            bottom: 20px;
            width: clamp(30px, 4vw, 48px);
            height: clamp(30px, 4vw, 48px);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .energy-wave.blue {
            background: radial-gradient(circle, #ffffff 10%, #70a1ff 40%, #1e90ff 70%, transparent 100%);
            box-shadow: 0 0 25px #00d2d3, 0 0 45px #2e86de, inset 0 0 15px #fff;
        }

        .energy-wave.red {
            background: radial-gradient(circle, #ffffff 10%, #ff7675 40%, #d63031 70%, transparent 100%);
            box-shadow: 0 0 25px #ff4757, 0 0 45px #ee5253, inset 0 0 15px #fff;
        }

        .energy-wave.super-wave {
            width: clamp(48px, 6vw, 75px) !important;
            height: clamp(48px, 6vw, 75px) !important;
            box-shadow: 0 0 40px #f1c40f, 0 0 65px #e056fd, inset 0 0 25px #ffffff !important;
        }

        @keyframes wave-fly-p1 {
            0% { left: 80px; opacity: 1; transform: scale(0.6) rotate(0deg); }
            85% { left: calc(100% - 100px); opacity: 1; transform: scale(1.3) rotate(360deg); }
            100% { left: calc(100% - 65px); opacity: 0; transform: scale(1.8) rotate(540deg); }
        }

        @keyframes wave-fly-p2 {
            0% { right: 80px; opacity: 1; transform: scale(0.6) rotate(0deg); }
            85% { right: calc(100% - 100px); opacity: 1; transform: scale(1.3) rotate(-360deg); }
            100% { right: calc(100% - 65px); opacity: 0; transform: scale(1.8) rotate(-540deg); }
        }

        .wave-shoot-p1 { animation: wave-fly-p1 0.36s cubic-bezier(0.2, 0.7, 0.4, 1) forwards; }
        .wave-shoot-p2 { animation: wave-fly-p2 0.36s cubic-bezier(0.2, 0.7, 0.4, 1) forwards; }

        .hit-impact-spark {
            position: absolute;
            top: 40%;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff, #ffeaa7 40%, rgba(255, 71, 87, 0.8) 70%, transparent 100%);
            transform: translate(-50%, -50%) scale(0);
            opacity: 0;
            pointer-events: none;
            z-index: 60;
            box-shadow: 0 0 30px #fff, 0 0 50px #f1c40f;
        }

        @keyframes spark-burst {
            0% { transform: translate(-50%, -50%) scale(0.2); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; filter: brightness(2); }
            100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
        }

        .spark-active { animation: spark-burst 0.32s ease-out forwards; }

        @keyframes arena-shake {
            0%, 100% { transform: translateY(0); }
            15% { transform: translateY(-6px) translateX(4px); }
            35% { transform: translateY(5px) translateX(-4px); }
            55% { transform: translateY(-3px) translateX(2px); }
            75% { transform: translateY(2px) translateX(-2px); }
        }

        .arena-vibrating { animation: arena-shake 0.35s ease-out; }

        .screen-flash {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 200;
            transition: opacity 0.1s ease-in;
        }
        .screen-flash.active { opacity: 0.55; }

        /* ==========================================
           主答題區佈局：左玩家 | 右玩家
           ========================================== */
        #game-stage {
            flex: 1;
            display: flex;
            flex-direction: row;
            padding: 5px 12px;
            gap: 12px;
            overflow: hidden;
            min-height: 0;
        }

        .player-panel {
            flex: 1;
            background: #ffffff;
            border-radius: 16px;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            padding: 8px 12px 6px 12px;
            position: relative;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
            border: 4px solid;
            min-width: 0;
            min-height: 0;
        }

        #panel-1 { border-color: var(--accent-p1); background: #fbfdff; }
        #panel-2 { border-color: var(--accent-p2); background: #fffbfc; }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 4px;
            margin-bottom: 2px;
            border-bottom: 2px dashed #dcdde1;
            flex-shrink: 0;
        }

        .player-title {
            font-size: 1rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .combo-badge {
            font-size: 0.78rem;
            font-weight: 800;
            padding: 1px 7px;
            border-radius: 9px;
            background: #dfe4ea;
            color: #57606f;
            transition: all 0.2s;
        }

        .combo-badge.active {
            background: #ffeaa7;
            color: #d35400;
            box-shadow: 0 0 6px rgba(243, 156, 18, 0.5);
        }

        .combo-badge.super {
            background: #e2d1f9;
            color: #8e44ad;
            box-shadow: 0 0 10px rgba(142, 68, 173, 0.6);
        }

        .player-timer {
            font-size: 0.78rem;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 8px;
            background: #e8f4fd;
            color: #2980b9;
        }

        .player-timer.fast { background: #e8f8f5; color: #27ae60; }
        .player-timer.slow { background: #fdf2e9; color: #d35400; }

        /* ==========================================================
           直式與鍵盤高度嚴格遵守 2 : 1 比例設定
           ========================================================== */
        .math-section {
            flex: 1;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: clamp(10px, 2.6vw, 28px);
            min-height: 0;
            padding: 4px 0;
            overflow: hidden;
        }

        /* 直式容器：高度佔比 2 */
        .math-column-wrap {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: var(--math-col-height);
            flex: 0 1 auto;
            min-width: 0;
        }

        .math-grid {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
        }

        .math-row {
            display: flex;
            gap: clamp(4px, 0.9vw, 8px);
            justify-content: flex-end;
            width: 100%;
            align-items: center;
        }

        /* 直式單元格大小適配 */
        .math-cell {
            width: clamp(48px, 5.5vw, 68px);
            height: clamp(40px, 5.8vh, 56px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2rem, 3.8vw, 3rem);
            font-weight: bold;
            border-radius: 9px;
            position: relative;
            color: #2d3436;
        }

        .header-cell {
            font-size: clamp(0.9rem, 1.4vw, 1.2rem);
            color: #7f8c8d;
            height: clamp(18px, 2.6vh, 26px);
            font-weight: bold;
        }

        .symbol-cell {
            color: #2d3436;
            justify-content: flex-start;
        }

        .divider-row {
            border-bottom: clamp(3px, 0.5vh, 5px) solid #2d3436;
            margin: clamp(1px, 0.2vh, 2px) 0;
            width: 100%;
        }

        /* [進位] 按鈕 */
        .carry-btn {
            background-color: #f1f2f6;
            border: 2px dashed #a4b0be;
            color: #747d8c;
            font-size: clamp(0.72rem, 1vw, 0.92rem);
            border-radius: 50%;
            width: clamp(36px, 4.2vw, 48px);
            height: clamp(36px, 4.2vw, 48px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            font-weight: bold;
        }

        .carry-btn.active-carry {
            background-color: var(--carry-bg);
            border: 2px solid #e67e22;
            color: #d35400;
            font-size: clamp(1.35rem, 2.2vw, 1.8rem);
        }

        /* 答案輸入方格 */
        .answer-box {
            border: 3px dashed #b2bec3;
            background-color: #f8f9fa;
            cursor: pointer;
        }

        .answer-box.selected {
            border: 3px solid var(--active-border) !important;
            background-color: #ffffff !important;
            box-shadow: 0 0 10px rgba(255, 118, 117, 0.55);
        }

        .answer-box.filled {
            border-style: solid;
            border-color: #74b9ff;
            background-color: #f1f6ff;
        }

        .cell-wrong {
            border: 3px solid var(--wrong-color) !important;
            background-color: #ffe6e6 !important;
            color: var(--wrong-color) !important;
        }

        .cell-correct {
            border: 3px solid var(--correct-color) !important;
            background-color: #e8f8f5 !important;
            color: var(--correct-color) !important;
        }

        /* 數字鍵盤容器：高度佔比 1（正好為直式高度的 50%） */
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: clamp(3px, 0.4vw, 5px);
            width: clamp(120px, 14.5vw, 160px);
            height: var(--numpad-height); /* 精準 2:1 比例 */
            flex-shrink: 0;
        }

        .numpad-btn {
            background-color: #e2d1f9;
            border: 1.5px solid #b898eb;
            border-radius: 7px;
            height: 100%;
            font-size: clamp(0.95rem, 1.5vw, 1.25rem);
            font-weight: bold;
            color: #2d3436;
            box-shadow: 0 2px 0 #b898eb;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.08s;
        }

        .numpad-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 #b898eb;
        }

        .numpad-btn.btn-clear {
            background-color: #ffb7b2;
            border-color: #f7908a;
            box-shadow: 0 2px 0 #f7908a;
            font-size: clamp(0.8rem, 1vw, 0.95rem);
        }

        .numpad-btn.btn-submit-key {
            background-color: #2ed573;
            border-color: #20af5c;
            color: white;
            box-shadow: 0 2px 0 #1b8a49;
            font-size: clamp(0.82rem, 1.05vw, 0.96rem);
            letter-spacing: 0.5px;
        }

        .numpad-btn.btn-retry-mode {
            background-color: #ffa502 !important;
            border-color: #e67e22 !important;
            box-shadow: 0 2px 0 #d35400 !important;
        }

        .numpad-btn.btn-next-mode {
            background-color: #3498db !important;
            border-color: #2980b9 !important;
            box-shadow: 0 2px 0 #1f618d !important;

    <!-- 獲勝結算彈窗 -->

        <div class="win-sub" id="win-subtitle">以精準的算術重擊擊倒對手！</div>

    </div>

    <script>
        // ==========================================
        // 音效系統
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        const Sound = {
            click: () => playTone(480, 'sine', 0.06),
            whoosh: () => {
                playTone(320, 'sine', 0.1);
                setTimeout(() => playTone(180, 'sawtooth', 0.12), 40);
            },
            hit: () => {
                playTone(160, 'sawtooth', 0.2);
                setTimeout(() => playTone(110, 'square', 0.16), 40);
            },
            crit: () => {
                playTone(280, 'sawtooth', 0.12);
                setTimeout(() => playTone(450, 'triangle', 0.16), 70);
                setTimeout(() => playTone(720, 'sine', 0.25), 140);
            },
            superHit: () => {
                [180, 320, 500, 750, 1050].forEach((f, idx) => {
                    setTimeout(() => playTone(f, 'sawtooth', 0.22), idx * 60);
                });
            },
            wrong: () => playTone(150, 'sawtooth', 0.35),
            win: () => {
                [440, 554, 659, 880].forEach((f, i) => {
                    setTimeout(() => playTone(f, 'triangle', 0.2), i * 120);
                });
            }
        };

        const PLACE_LABELS = ["個", "十", "百", "千", "萬"];
        let matchConfig = {
            level: 2,
            maxHp: 100,
            baseDamage: 15,
            speedBonusDamage: 5
        };

        let isGameOver = false;

        class CombatPlayer {
            constructor(id) {
                this.id = id;
                this.opponentId = (id === 1) ? 2 : 1;
                this.hp = matchConfig.maxHp;
                this.combo = 0;

                this.gridEl = document.getElementById(`grid-${id}`);
                this.numpadEl = document.getElementById(`numpad-${id}`);
                this.chanceEl = document.getElementById(`chance-${id}`);
                this.timerEl = document.getElementById(`timer-${id}`);
                this.comboEl = document.getElementById(`combo-${id}`);
                this.hpFillEl = document.getElementById(`hp-fill-${id}`);
                this.hpTextEl = document.getElementById(`hp-text-${id}`);
                this.energyFillEl = document.getElementById(`energy-fill-${id}`);
                this.fighterWrapEl = document.getElementById(`fighter-wrap-${id}`);
                this.submitBtn = null;

                this.num1 = [];
                this.num2 = [];
                this.carries = [];
                this.answers = [];
                this.carryErrors = [];
                this.ansErrors = [];

                this.currentSelectedCol = 0;
                this.modifyChances = 1;
                this.isDisplayingAnswer = false;

                // 計時器
                this.startTime = null;
                this.timerInterval = null;
                this.elapsedSeconds = 0;

                this.initNumpad();
                this.generateNewQuestion();
            }

            initNumpad() {
                this.numpadEl.innerHTML = '';
                const layout = [1, 2, 3, 4, 5, 6, 7, 8, 9, "清除", 0, "提交"];
                layout.forEach(item => {
                    const btn = document.createElement('div');
                    btn.className = 'numpad-btn';

                    if (item === "清除") {
                        btn.classList.add('btn-clear');
                        btn.textContent = item;
                        btn.addEventListener('pointerdown', (e) => {
                            e.preventDefault();
                            Sound.click();
                            this.handleKeypad(item);
                        });
                    } else if (item === "提交") {
                        btn.classList.add('btn-submit-key');
                        btn.textContent = "提交";
                        this.submitBtn = btn;
                        btn.addEventListener('pointerdown', (e) => {
                            e.preventDefault();
                            this.handleActionClick();
                        });
                    } else {
                        btn.textContent = item;
                        btn.addEventListener('pointerdown', (e) => {
                            e.preventDefault();
                            Sound.click();
                            this.handleKeypad(item);
                        });
                    }
                    this.numpadEl.appendChild(btn);
                });
            }

            startTimer() {
                if (this.timerInterval) clearInterval(this.timerInterval);
                this.startTime = Date.now();
                this.timerInterval = setInterval(() => {
                    if (isGameOver) return;
                    let diff = (Date.now() - this.startTime) / 1000;
                    this.elapsedSeconds = diff;
                    this.timerEl.textContent = `用時: ${diff.toFixed(1)}s`;
                    if (diff <= 5.0) {
                        this.timerEl.className = 'player-timer fast';
                    } else {
                        this.timerEl.className = 'player-timer slow';
                    }
                }, 100);
            }

            stopTimer() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
            }

            // 題庫生成：最高位不為 1，兩位數和嚴格維持兩位數 (< 10^lvl)
            generateNewQuestion() {
                if (isGameOver) return;
                let lvl = matchConfig.level;
                this.num1 = [];
                this.num2 = [];
                this.carries = Array(lvl + 1).fill(0); 
                this.answers = Array(lvl).fill(null);
                this.carryErrors = Array(lvl + 1).fill(false);
                this.ansErrors = Array(lvl).fill(false);
                this.modifyChances = 1;
                this.isDisplayingAnswer = false;
                this.currentSelectedCol = 0;

                let found = false;
                let attempts = 0;

                while (!found && attempts < 10000) {
                    attempts++;
                    // 最高位限制為 2 ~ 9 (排除 1)
                    let h1 = 2 + Math.floor(Math.random() * 8);
                    let h2 = 2 + Math.floor(Math.random() * 8);

                    let low1 = [];
                    let low2 = [];
                    for (let i = 0; i < lvl - 1; i++) {
                        low1.push(Math.floor(Math.random() * 10));
                        low2.push(Math.floor(Math.random() * 10));
                    }

                    let val1 = h1 * Math.pow(10, lvl - 1);
                    let val2 = h2 * Math.pow(10, lvl - 1);
                    for (let i = 0; i < lvl - 1; i++) {
                        val1 += low1[i] * Math.pow(10, i);
                        val2 += low2[i] * Math.pow(10, i);
                    }

                    let totalSum = val1 + val2;

                    // 確保加法結果維持在 lvl 位數 (< 10^lvl)
                    if (totalSum < Math.pow(10, lvl)) {
                        this.num1 = [...low1, h1];
                        this.num2 = [...low2, h2];
                        found = true;
                    }
                }

                if (this.submitBtn) {
                    this.submitBtn.className = 'numpad-btn btn-submit-key';
                    this.submitBtn.textContent = "提交";
                }
                this.chanceEl.textContent = "剩餘修改機會：1 次";
                this.renderGrid();
                this.startTimer();
            }

            handleKeypad(val) {
                if (this.isDisplayingAnswer || isGameOver) return;

                if (val === "清除") {
                    this.answers[this.currentSelectedCol] = null;
                    this.ansErrors[this.currentSelectedCol] = false;
                } else if (typeof val === 'number') {
                    this.answers[this.currentSelectedCol] = val;
                    this.ansErrors[this.currentSelectedCol] = false;

                    if (this.currentSelectedCol < matchConfig.level - 1) {
                        this.currentSelectedCol++;
                    }
                }
                this.renderGrid();
            }

            toggleCarry(col) {
                if (this.isDisplayingAnswer || isGameOver) return;
                Sound.click();
                this.carries[col] = (this.carries[col] === 1) ? 0 : 1;
                this.carryErrors[col] = false;
                this.renderGrid();
            }

            renderGrid() {
                this.gridEl.innerHTML = '';
                let maxCol = matchConfig.level;
                let rows = [[], [], [], [], [], []];

                for (let c = maxCol; c >= 0; c--) {
                    let isSymbolCol = (c === maxCol);

                    // 1. 表頭（位值標籤：個、十、百、千、萬）
                    let hCell = document.createElement('div');
                    hCell.className = 'math-cell header-cell';
                    hCell.textContent = isSymbolCol ? "" : PLACE_LABELS[c];
                    rows[0].push(hCell);

                    // 2. 進位按鈕列
                    let carryCell = document.createElement('div');
                    carryCell.className = 'math-cell';
                    if (!isSymbolCol && c > 0) {
                        let isCarried = this.carries[c] === 1;
                        let carryBtn = document.createElement('button');
                        carryBtn.className = 'carry-btn' + (isCarried ? ' active-carry' : '');
                        carryBtn.textContent = isCarried ? "1" : "進位";
                        carryBtn.onclick = () => this.toggleCarry(c);

                        if (this.carryErrors[c]) {
                            carryBtn.classList.add('cell-wrong');
                        } else if (this.isDisplayingAnswer && isCarried) {
                            carryBtn.classList.add('cell-correct');
                        }
                        carryCell.appendChild(carryBtn);
                    }
                    rows[1].push(carryCell);

                    // 3. 被加數
                    let n1Cell = document.createElement('div');
                    n1Cell.className = 'math-cell';
                    n1Cell.textContent = !isSymbolCol ? this.num1[c] : "";
                    rows[2].push(n1Cell);

                    // 4. 加數與加號
                    let n2Cell = document.createElement('div');
                    n2Cell.className = 'math-cell';
                    if (isSymbolCol) {
                        n2Cell.textContent = "+";
                        n2Cell.classList.add('symbol-cell');
                    } else {
                        n2Cell.textContent = this.num2[c] !== undefined ? this.num2[c] : "";
                    }
                    rows[3].push(n2Cell);

                    // 5. 答案列
                    let ansCell = document.createElement('div');
                    ansCell.className = 'math-cell';
                    if (!isSymbolCol) {
                        let aBox = document.createElement('div');
                        aBox.className = 'math-cell answer-box';
                        if (this.answers[c] !== null && this.answers[c] !== undefined) {
                            aBox.textContent = this.answers[c];
                            aBox.classList.add('filled');
                        }
                        if (this.currentSelectedCol === c && !this.isDisplayingAnswer) {
                            aBox.classList.add('selected');
                        }

                        aBox.onclick = () => {
                            if (this.isDisplayingAnswer || isGameOver) return;
                            this.currentSelectedCol = c;
                            this.renderGrid();
                        };

                        if (this.ansErrors[c]) {
                            aBox.classList.add('cell-wrong');
                        } else if (this.isDisplayingAnswer) {
                            aBox.classList.add('cell-correct');
                        }
                        ansCell.appendChild(aBox);
                    }
                    rows[5].push(ansCell);
                }

                rows.forEach((rowEls, idx) => {
                    if (idx === 4) {
                        let divLine = document.createElement('div');
                        divLine.className = 'divider-row';
                        this.gridEl.appendChild(divLine);
                    } else {
                        let rowDiv = document.createElement('div');
                        rowDiv.className = 'math-row';
                        rowEls.forEach(el => rowDiv.appendChild(el));
                        this.gridEl.appendChild(rowDiv);
                    }
                });
            }

            handleActionClick() {
                if (isGameOver) return;
                if (this.isDisplayingAnswer) {
                    this.generateNewQuestion();
                    return;
                }
                this.submitAndVerify();
            }

            submitAndVerify() {
                let correctCarries = Array(matchConfig.level + 1).fill(0);
                let correctDigits = Array(matchConfig.level).fill(0);
                let cTemp = 0;
                for (let i = 0; i < matchConfig.level; i++) {
                    correctCarries[i] = cTemp;
                    let sum = (this.num1[i] || 0) + (this.num2[i] || 0) + cTemp;
                    correctDigits[i] = sum % 10;
                    cTemp = sum > 9 ? 1 : 0;
                }
                correctCarries[matchConfig.level] = cTemp;

                let hasError = false;
                this.ansErrors = Array(matchConfig.level).fill(false);
                this.carryErrors = Array(matchConfig.level + 1).fill(false);

                // 未填妥或填錯一律判定答錯，不彈提示
                for (let i = 0; i < matchConfig.level; i++) {
                    if (this.answers[i] === null || this.answers[i] === undefined || this.answers[i] !== correctDigits[i]) {
                        this.ansErrors[i] = true;
                        hasError = true;
                    }
                    if (i > 0 && this.carries[i] !== correctCarries[i]) {
                        this.carryErrors[i] = true;
                        hasError = true;
                    }
                }

                if (!hasError) {
                    // 答對，發動格鬥打擊
                    this.stopTimer();
                    this.combo++;
                    this.updateComboUI();

                    let damage = matchConfig.baseDamage;
                    let isCrit = false;
                    let isSuper = false;

                    // 5秒速答加成
                    if (this.elapsedSeconds <= 5.0) {
                        damage += matchConfig.speedBonusDamage;
                    }

                    // 連擊觸發暴擊與終極大招
                    if (this.combo >= 3) {
                        damage = Math.round(damage * 2.2);
                        isSuper = true;
                    } else if (this.combo === 2) {
                        damage = Math.round(damage * 1.5);
                        isCrit = true;
                    }

                    executeAttack(this.id, this.opponentId, damage, isCrit, isSuper);

                    let attackMsg = isSuper ? "💥 釋放終極大招！" : (isCrit ? "🔥 觸發暴擊打擊！" : "🥊 發動精準攻擊！");
                    if (this.elapsedSeconds <= 5.0) attackMsg += " ⚡速答加成";
                    this.chanceEl.textContent = attackMsg;

                    if (this.submitBtn) this.submitBtn.classList.add('disabled');
                    setTimeout(() => {
                        if (!isGameOver) this.generateNewQuestion();
                    }, 1200);
                } else {
                    // 答錯，連擊中斷
                    Sound.wrong();
                    this.combo = 0;
                    this.updateComboUI();

                    let activePanel = document.getElementById(`panel-${this.id}`);
                    activePanel.classList.add('shake');
                    setTimeout(() => activePanel.classList.remove('shake'), 400);

                    if (this.modifyChances > 0) {
                        this.modifyChances--;
                        this.chanceEl.textContent = "請修正紅框標示處！剩餘修改機會：0 次";
                        if (this.submitBtn) {
                            this.submitBtn.textContent = "重交";
                            this.submitBtn.classList.add('btn-retry-mode');
                        }
                        for (let i = 0; i < matchConfig.level; i++) {
                            if (this.ansErrors[i]) {
                                this.currentSelectedCol = i;
                                break;
                            }
                        }
                        this.renderGrid();
                    } else {
                        // 第二次答錯，公佈答案
                        this.stopTimer();
                        this.isDisplayingAnswer = true;
                        this.ansErrors = Array(matchConfig.level).fill(false);
                        this.carryErrors = Array(matchConfig.level + 1).fill(false);

                        this.answers = correctDigits;
                        this.carries = correctCarries;

                        this.chanceEl.textContent = "💡 已顯示正解，觀察後點擊『下一題』繼續！";
                        if (this.submitBtn) {
                            this.submitBtn.className = 'numpad-btn btn-submit-key btn-next-mode';
                            this.submitBtn.textContent = "下一題";
                        }
                        this.renderGrid();
                    }
                }
            }

            updateComboUI() {
                this.comboEl.textContent = `連擊: ${this.combo}`;
                if (this.combo >= 3) {
                    this.comboEl.className = 'combo-badge super';
                    this.energyFillEl.style.width = '100%';
                    this.energyFillEl.style.background = 'linear-gradient(90deg, #9b59b6, #e056fd)';
                } else if (this.combo === 2) {
                    this.comboEl.className = 'combo-badge active';
                    this.energyFillEl.style.width = '66%';
                    this.energyFillEl.style.background = 'linear-gradient(90deg, #f1c40f, #e67e22)';
                } else if (this.combo === 1) {
                    this.comboEl.className = 'combo-badge active';
                    this.energyFillEl.style.width = '33%';
                    this.energyFillEl.style.background = '#f1c40f';
                } else {
                    this.comboEl.className = 'combo-badge';
                    this.energyFillEl.style.width = '0%';
                }
            }
        }

        let players = [];

        function executeAttack(attackerId, defenderId, damage, isCrit, isSuper) {
            const attackerWrap = document.getElementById(`fighter-wrap-${attackerId}`);
            const defenderWrap = document.getElementById(`fighter-wrap-${defenderId}`);
            const defenderObj = players[defenderId - 1];
            const bullet = document.getElementById(`bullet-${attackerId}`);
            const damagePopup = document.getElementById(`damage-popup-${defenderId}`);
            const spark = document.getElementById(`spark-${defenderId}`);
            const combatHud = document.getElementById('combat-hud');
            const flash = document.getElementById('screen-flash');

            Sound.whoosh();
            attackerWrap.classList.add(attackerId === 1 ? 'char-dash-p1' : 'char-dash-p2');

            let bulletClass = `energy-wave ${attackerId === 1 ? 'blue wave-shoot-p1' : 'red wave-shoot-p2'}`;
            if (isSuper) bulletClass += ' super-wave';
            bullet.className = bulletClass;

            if (isSuper) {
                flash.classList.add('active');
                setTimeout(() => flash.classList.remove('active'), 120);
            }

            setTimeout(() => {
                attackerWrap.classList.remove('char-dash-p1', 'char-dash-p2');
                bullet.className = `energy-wave ${attackerId === 1 ? 'blue' : 'red'}`;

                if (isSuper) Sound.superHit();
                else if (isCrit) Sound.crit();
                else Sound.hit();

                combatHud.classList.add('arena-vibrating');
                setTimeout(() => combatHud.classList.remove('arena-vibrating'), 350);

                defenderWrap.classList.add(defenderId === 1 ? 'char-hit-p1' : 'char-hit-p2');
                setTimeout(() => defenderWrap.classList.remove('char-hit-p1', 'char-hit-p2'), 420);

                spark.classList.add('spark-active');
                setTimeout(() => spark.classList.remove('spark-active'), 320);

                defenderObj.hp = Math.max(0, defenderObj.hp - damage);
                updateHpUI(defenderObj);

                let popupText = `-${damage}`;
                if (isSuper) popupText += " 💥SUPER!";
                else if (isCrit) popupText += " 🔥CRIT!";

                damagePopup.textContent = popupText;
                damagePopup.className = `damage-popup ${isSuper ? 'super' : (isCrit ? 'crit' : '')} show`;
                setTimeout(() => {
                    damagePopup.className = 'damage-popup';
                }, 750);

                if (defenderObj.hp <= 0 && !isGameOver) {
                    isGameOver = true;
                    Sound.win();
                    setTimeout(() => declareWinner(attackerId), 450);
                }
            }, 300);
        }

        function updateHpUI(player) {
            const percentage = (player.hp / matchConfig.maxHp) * 100;
            player.hpFillEl.style.width = `${percentage}%`;
            player.hpTextEl.textContent = `${player.hp} / ${matchConfig.maxHp}`;

            if (percentage <= 25) {
                player.hpFillEl.style.background = 'linear-gradient(180deg, #ff4757 0%, #c0392b 100%)';
                player.hpFillEl.style.boxShadow = '0 0 10px rgba(255, 71, 87, 0.8)';
            } else if (percentage <= 55) {
                player.hpFillEl.style.background = 'linear-gradient(180deg, #f1c40f 0%, #d35400 100%)';
                player.hpFillEl.style.boxShadow = '0 0 10px rgba(241, 196, 15, 0.8)';
            } else {
                player.hpFillEl.style.background = 'linear-gradient(180deg, #2ed573 0%, #10ac84 100%)';
                player.hpFillEl.style.boxShadow = '0 0 10px rgba(46, 213, 115, 0.6)';
            }
        }

        function declareWinner(winnerId) {
            const overlay = document.getElementById('win-overlay');
            const title = document.getElementById('win-title');
            const subtitle = document.getElementById('win-subtitle');

            const winnerColor = winnerId === 1 ? '藍方拳士' : '紅方鬥士';
            title.textContent = `🏆 玩家 ${winnerId} (${winnerColor}) 獲勝！`;
            subtitle.textContent = `以精湛算術發動終結重擊，完美 K.O. 對手！`;
            overlay.classList.add('show');
        }

        function restartMatch() {
            isGameOver = false;
            document.getElementById('win-overlay').classList.remove('show');
            players.forEach(p => {
                p.stopTimer();
                p.hp = matchConfig.maxHp;
                p.combo = 0;
                p.updateComboUI();
                updateHpUI(p);
                p.generateNewQuestion();
            });
        }

        function initApp() {
            players = [new CombatPlayer(1), new CombatPlayer(2)];

            document.getElementById('sel-level').addEventListener('change', (e) => {
                matchConfig.level = parseInt(e.target.value);
                restartMatch();
            });
        }

        window.onload = initApp;
    </script>
</body>
</html>
