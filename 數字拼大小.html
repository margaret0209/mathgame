<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <!-- 確保在 iPad 上全螢幕且禁止縮放，符合 App 的操作體驗 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>數字拼大小</title>
    <style>
        :root {
            /* 馬卡龍超柔和色系 */
            --bg-base: #FDFBFF;       /* 雲朵白底色 */
            --player-0-bg: #FFE5EC;   /* 櫻花粉 */
            --player-1-bg: #E0F7FA;   /* 薄荷藍 */
            --player-2-bg: #FFF9C4;   /* 奶油黃 */
            
            --text-main: #6B5B60;     /* 溫暖的深灰褐色 (取代純黑) */
            --text-light: #9EA3B0;    
            --coral-pink: #FF8BA7;    /* 溫和的珊瑚粉 (用於強調/提示) */
            
            /* 按鈕色系 */
            --btn-start: #FFB7B2;
            --btn-start-shadow: #FF9E99;
            --btn-submit: #A8E6CF;
            --btn-submit-shadow: #88D4AB;
            --btn-disabled: #E0E0E0;
            --btn-disabled-shadow: #BDBDBD;
            
            --shadow-soft: rgba(0, 0, 0, 0.06);
            --shadow-medium: rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Quicksand', 'Nunito', 'Comic Sans MS', 'Chalkboard SE', '微軟正黑體', sans-serif;
            background: linear-gradient(135deg, #FFF0F5 0%, #E6F2FF 100%);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            touch-action: none; 
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: opacity 0.4s ease-in-out;
            overflow: hidden; 
        }

        .hidden {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        /* 主選單設計 */
        #menu-screen {
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 5.5vmin;
            margin-bottom: 5vh;
            color: var(--coral-pink);
            background: rgba(255, 255, 255, 0.85);
            padding: 2.5vmin 6vmin;
            border-radius: 5vmin;
            box-shadow: 0 1vmin 3vmin var(--shadow-soft);
            border: 0.5vmin solid #FFF;
            backdrop-filter: blur(5px);
            letter-spacing: 0.2vmin;
        }

        .settings-panel {
            background: rgba(255, 255, 255, 0.9);
            padding: 4.5vmin;
            border-radius: 4vmin;
            box-shadow: 0 2vmin 5vmin var(--shadow-soft);
            display: flex;
            flex-direction: column;
            gap: 3vh;
            width: 85vw;
            max-width: 65vmin;
            border: 0.3vmin solid rgba(255,255,255,0.5);
            backdrop-filter: blur(10px);
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 2.8vmin;
            font-weight: bold;
            color: var(--text-main);
        }

        select {
            font-size: 2.6vmin;
            padding: 1.2vmin 2.5vmin;
            border-radius: 2vmin;
            border: 0.3vmin solid #E8E8E8;
            background-color: #FAFAFA;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        select:focus {
            border-color: var(--btn-start);
            box-shadow: 0 0 1vmin rgba(255, 183, 178, 0.3);
        }

        .btn-start {
            margin-top: 2vh;
            padding: 2.5vmin 4vmin;
            font-size: 4vmin;
            font-weight: bold;
            color: white;
            background-color: var(--btn-start);
            border: none;
            border-radius: 3.5vmin;
            cursor: pointer;
            box-shadow: 0 0.8vmin 0 var(--btn-start-shadow), 0 1.5vmin 2vmin var(--shadow-soft);
            transition: transform 0.1s, box-shadow 0.1s;
            letter-spacing: 0.2vmin;
        }

        .btn-start:active {
            transform: translateY(0.8vmin);
            box-shadow: 0 0px 0 var(--btn-start-shadow), 0 0.5vmin 1vmin var(--shadow-soft);
        }

        /* 遊戲畫面排版 */
        #game-screen {
            background-color: var(--bg-base);
        }

        #top-bar {
            height: 8vh; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4vw;
            background-color: rgba(255, 255, 255, 0.7);
            border-bottom: 0.2vmin solid rgba(0,0,0,0.03);
            font-size: 3vmin;
            font-weight: bold;
            backdrop-filter: blur(5px);
            color: var(--text-main);
        }

        #top-bar button {
            padding: 1.2vmin 2.5vmin; 
            font-size: 2.5vmin; 
            border-radius: 2vmin; 
            cursor: pointer; 
            border: 0.3vmin solid #E0E0E0; 
            background: white;
            color: var(--text-light);
            font-weight: bold;
            transition: all 0.2s;
        }

        #top-bar button:active {
            background: #F0F0F0;
            transform: scale(0.95);
        }

        #boards-container {
            display: flex;
            flex: 1;
            width: 100vw;
            height: 92vh; 
        }

        .player-board {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 2vmin;
            min-width: 0; 
            border-right: 0.4vmin dashed rgba(0,0,0,0.04);
        }
        .player-board:last-child {
            border-right: none;
        }

        .color-0 { background-color: var(--player-0-bg); }
        .color-1 { background-color: var(--player-1-bg); }
        .color-2 { background-color: var(--player-2-bg); }

        .player-header {
            text-align: center;
            font-size: 3.2vmin;
            font-weight: bold;
            margin-bottom: 1.5vh;
            color: var(--text-main);
            background: rgba(255,255,255,0.65);
            border-radius: 2.5vmin;
            padding: 1.5vmin;
            flex-shrink: 0;
            box-shadow: 0 0.5vmin 1.5vmin var(--shadow-soft);
        }

        .instruction {
            text-align: center;
            font-size: 3vmin;
            font-weight: bold;
            color: var(--coral-pink);
            margin-bottom: 1.5vh;
            text-shadow: 0.2vmin 0.2vmin 0px white;
            flex-shrink: 0;
            background: rgba(255,255,255,0.4);
            padding: 1vmin;
            border-radius: 1.5vmin;
        }

        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            padding: 1vh 0;
            min-height: 0; 
        }

        /* 數字方塊區排版 */
        .slots-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2vmin;
            width: 95%;
            flex: 1;
            max-height: 25vh; 
        }

        .slot {
            flex: 1;
            aspect-ratio: 1 / 1;
            max-height: 100%;
            max-width: 18vmin; 
            border: 0.4vmin dashed rgba(107, 91, 96, 0.25);
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 2.5vmin;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .block {
            width: 88%;
            height: 88%;
            background: linear-gradient(180deg, #FFFFFF 0%, #F5F5F5 100%);
            border-radius: 2vmin;
            box-shadow: 0 0.8vmin 0px rgba(0,0,0,0.06), 0 1.5vmin 2vmin var(--shadow-soft);
            border: 0.2vmin solid rgba(255,255,255,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 5.5vmin; 
            font-weight: bold;
            color: var(--text-main);
            cursor: grab;
            transform: translate(0px, 0px); 
            touch-action: none;
            pointer-events: auto;
        }
        
        .block.dragging {
            cursor: grabbing;
            opacity: 0.95;
            box-shadow: 0 2vmin 4vmin rgba(0,0,0,0.15);
            z-index: 1000; 
        }

        .submit-btn {
            margin: 1.5vh auto;
            width: 85%;
            max-width: 32vmin;
            padding: 2.2vmin 0;
            font-size: 3.5vmin;
            font-weight: bold;
            color: white;
            background-color: var(--btn-submit);
            border: none;
            border-radius: 3vmin;
            cursor: pointer;
            box-shadow: 0 0.8vmin 0 var(--btn-submit-shadow);
            transition: transform 0.1s, box-shadow 0.1s, background-color 0.3s;
            display: block;
            flex-shrink: 0;
            letter-spacing: 0.2vmin;
        }

        .submit-btn:active:not(:disabled) {
            transform: translateY(0.8vmin);
            box-shadow: 0 0px 0 var(--btn-submit-shadow);
        }

        .submit-btn:disabled {
            background-color: var(--btn-disabled);
            box-shadow: 0 0.8vmin 0 var(--btn-disabled-shadow);
            color: #999;
            cursor: not-allowed;
        }

        .feedback-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25vmin;
            pointer-events: none;
            z-index: 50;
            opacity: 0;
        }

        @keyframes popInAndFade {
            0% { transform: scale(0.5); opacity: 0; }
            30% { transform: scale(1.2); opacity: 1; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        .animate-correct {
            animation: popInAndFade 1.5s ease forwards;
            color: #88D4AB;
            text-shadow: 0 0 4vmin white;
        }

        .animate-wrong {
            animation: popInAndFade 1.5s ease forwards;
            color: #FFB7B2;
            text-shadow: 0 0 4vmin white;
        }

        /* 結算畫面設計 */
        #result-screen {
            background: rgba(253, 251, 255, 0.95);
            align-items: center;
            justify-content: center;
            z-index: 2000;
            backdrop-filter: blur(8px);
        }

        .result-box {
            background: white;
            padding: 5vmin;
            border-radius: 4vmin;
            box-shadow: 0 2vmin 6vmin var(--shadow-medium);
            text-align: center;
            border: 0.6vmin solid white;
            width: 90vw;
            max-width: none;
        }

        .result-box h2 {
            font-size: 5.5vmin;
            margin-bottom: 4vh;
            color: var(--coral-pink);
            letter-spacing: 0.2vmin;
        }

        .result-scores {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 3vmin;
            margin-bottom: 5vh;
            width: 100%;
        }

        .score-card {
            flex: 1;
            padding: 3vmin 2vmin;
            border-radius: 3vmin;
            box-shadow: 0 1vmin 2.5vmin var(--shadow-soft);
            border: 0.3vmin solid white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .score-card .crown {
            font-size: 5.5vmin;
            min-height: 6vmin; 
            margin-bottom: 1.5vmin;
        }

        .score-card h3 {
            font-size: 3.5vmin;
            color: var(--text-main);
            margin-bottom: 2vmin;
            background: rgba(255,255,255,0.5);
            padding: 0.5vmin;
            border-radius: 1.5vmin;
        }

        .score-card .score-number {
            font-size: 7vmin;
            font-weight: bold;
            color: var(--coral-pink);
            text-shadow: 0.2vmin 0.2vmin 0px white;
        }
    </style>
</head>
<body>

    <div id="menu-screen" class="screen">
        <h1>🔢 數字拼大小 🔢</h1>
        <div class="settings-panel">
            <div class="setting-row">
                <span>數字類型：</span>
                <select id="setting-digits">
                    <option value="2">兩位數</option>
                    <option value="3">三位數</option>
                    <option value="4">四位數</option>
                    <option value="5">五位數</option>
                    <option value="6">六位數</option>
                </select>
            </div>
            <div class="setting-row">
                <span>題型：</span>
                <select id="setting-type">
                    <option value="max">最大 (排最大數字)</option>
                    <option value="min">最小 (排最小數字)</option>
                    <option value="random">隨機 (最大或最小)</option>
                </select>
            </div>
            <div class="setting-row">
                <span>遊戲人數：</span>
                <select id="setting-players">
                    <option value="1">1 人</option>
                    <option value="2">2 人</option>
                    <option value="3">3 人</option>
                </select>
            </div>
            <div class="setting-row">
                <span>時間限制：</span>
                <select id="setting-time">
                    <option value="60">1 分鐘</option>
                    <option value="180">3 分鐘</option>
                    <option value="300">5 分鐘</option>
                </select>
            </div>
            <button class="btn-start" onclick="startGame()">開始遊戲</button>
        </div>
    </div>

    <div id="game-screen" class="screen hidden">
        <div id="top-bar">
            <div id="timer-display">時間: 01:00</div>
            <button onclick="endGame()" style="padding: 1vmin 2vmin; font-size: 2.5vmin; border-radius: 1.5vmin; cursor: pointer; border: 0.3vmin solid #ccc; background: white;">結束遊戲</button>
        </div>
        <div id="boards-container">
            <!-- 玩家版面將透過 JS 動態生成，支援 1-3 人分割畫面 -->
        </div>
    </div>

    <div id="result-screen" class="screen hidden">
        <div class="result-box">
            <h2>時間到！遊戲結束</h2>
            <div id="result-scores" class="result-scores">
                <!-- 分數顯示區 -->
            </div>
            <button class="btn-start" onclick="backToMenu()">返回主選單</button>
        </div>
    </div>

    <script>
        /** 
         * 給老師的修改說明：
         * 1. 遊戲設定預設可以在 HTML 的 <select> 標籤中修改。
         * 2. 分數計算在 submitAnswer 函數中：答對加 10 分，答錯扣 5 分。
         * 3. 顏色主題在 CSS 的 :root { ... } 中修改。
         */

        // --- 全域變數 ---
        let gameState = {
            digits: 2,
            type: 'max', // 'max', 'min', 'random'
            playersCount: 1,
            timeTotal: 60,
            timeRemaining: 60,
            timerId: null,
            players: [] 
            // players = [{ id, score, currentType, targetAnswer, DOM_elements }]
        };

        // --- Web Audio API 音效合成器 (完全離線) ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 播放自訂頻率的音效 (頻率, 波型, 持續時間)
        function playTone(freq, type, duration) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            // 音量設定，避免刺耳
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // 定義三種回饋音效
        function playClickSound() { playTone(400, 'sine', 0.1); }
        function playCorrectSound() { 
            playTone(600, 'sine', 0.1); 
            setTimeout(() => playTone(800, 'sine', 0.2), 100); 
        }
        function playWrongSound() { playTone(300, 'sawtooth', 0.3); }
        function playEndSound() { 
            playTone(500, 'square', 0.2);
            setTimeout(() => playTone(400, 'square', 0.3), 200);
        }

        function startGame() {
            initAudio();
            playClickSound();

            // 讀取設定
            gameState.digits = parseInt(document.getElementById('setting-digits').value);
            gameState.type = document.getElementById('setting-type').value;
            gameState.playersCount = parseInt(document.getElementById('setting-players').value);
            gameState.timeTotal = parseInt(document.getElementById('setting-time').value);
            gameState.timeRemaining = gameState.timeTotal;

            // 初始化玩家資料
            gameState.players = [];
            for (let i = 0; i < gameState.playersCount; i++) {
                gameState.players.push({
                    id: i,
                    score: 0,
                    currentType: '',
                    targetAnswer: ''
                });
            }

            // 切換畫面
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            renderBoards();
            updateTimerDisplay();

            // 開始計時
            clearInterval(gameState.timerId);
            gameState.timerId = setInterval(() => {
                gameState.timeRemaining--;
                updateTimerDisplay();
                if (gameState.timeRemaining <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            let m = Math.floor(gameState.timeRemaining / 60);
            let s = gameState.timeRemaining % 60;
            document.getElementById('timer-display').innerText = `時間: ${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        // 動態生成玩家遊戲區域 (支援1-3人分割畫面)
        function renderBoards() {
            const container = document.getElementById('boards-container');
            container.innerHTML = ''; // 清空

            gameState.players.forEach(player => {
                const board = document.createElement('div');
                board.className = `player-board color-${player.id}`;
                board.id = `player-board-${player.id}`;
                
                // 設定 HTML 結構
                board.innerHTML = `
                    <div class="player-header">玩家 ${player.id + 1} <br> 分數: <span id="score-${player.id}">0</span></div>
                    <div class="instruction" id="instruction-${player.id}">請拼出數字</div>
                    <div class="game-area">
                        <!-- 上排：答案框 (空位) -->
                        <div class="slots-row" id="answer-row-${player.id}"></div>
                        <!-- 下排：數字池 -->
                        <div class="slots-row" id="pool-row-${player.id}"></div>
                    </div>
                    <!-- 回饋特效圖層 -->
                    <div class="feedback-overlay" id="feedback-${player.id}"></div>
                    <button class="submit-btn" id="submit-${player.id}" onclick="submitAnswer(${player.id})">提交答案</button>
                `;
                container.appendChild(board);
                
                // 產生第一道題目
                generateQuestion(player.id);
            });
        }

        function generateQuestion(playerId) {
            const player = gameState.players[playerId];
            const answerRow = document.getElementById(`answer-row-${playerId}`);
            const poolRow = document.getElementById(`pool-row-${playerId}`);
            const instruction = document.getElementById(`instruction-${playerId}`);
            
            // 決定題型 (最大或最小)
            let currentType = gameState.type;
            if (currentType === 'random') {
                currentType = Math.random() > 0.5 ? 'max' : 'min';
            }
            player.currentType = currentType;
            
            // 更新提示字眼
            if (currentType === 'max') {
                instruction.innerHTML = "⬆️ 請拼出 <b>最大</b> 的數字 ⬆️";
            } else {
                instruction.innerHTML = "⬇️ 請拼出 <b>最小</b> 的數字 ⬇️";
            }

            // 隨機產生指定數量的數字
            let digits = [];
            for (let i = 0; i < gameState.digits; i++) {
                if (i === 0) {
                    // 保證至少有一個 1-9 的數字，避免出現全部都是 0 的情況
                    digits.push((Math.floor(Math.random() * 9) + 1).toString());
                } else {
                    digits.push(Math.floor(Math.random() * 10).toString());
                }
            }
            // 打亂陣列順序，避免學生發現產生的數字有規律
            digits.sort(() => Math.random() - 0.5);

            // 計算正確答案
            // 若為最大：數字由大到小排序。若為最小：由小到大排序。
            let sortedDigits = [...digits].sort();
            if (currentType === 'max') {
                sortedDigits.reverse(); 
            } else if (currentType === 'min') {
                // 如果是求最小值，且排序後第一個數字是 '0'，則這不是有效多位數（如 013）
                if (sortedDigits[0] === '0') {
                    // 找出第一個不是 '0' 的數字
                    let firstNonZeroIndex = sortedDigits.findIndex(d => d !== '0');
                    if (firstNonZeroIndex !== -1) {
                        // 將那個非 0 的數字移到最前面當作首位，原本首位的 0 退到後面
                        sortedDigits[0] = sortedDigits[firstNonZeroIndex];
                        sortedDigits[firstNonZeroIndex] = '0';
                    }
                }
            }
            player.targetAnswer = sortedDigits.join('');

            // 清空舊的 UI
            answerRow.innerHTML = '';
            poolRow.innerHTML = '';

            // 建立答案空槽 (上方) 與 來源槽 (下方)
            for (let i = 0; i < gameState.digits; i++) {
                // 答案空槽
                const ansSlot = document.createElement('div');
                ansSlot.className = 'slot ans-slot';
                answerRow.appendChild(ansSlot);

                // 來源槽 (內含可拖曳的數字方塊)
                const poolSlot = document.createElement('div');
                poolSlot.className = 'slot pool-slot';
                
                const block = document.createElement('div');
                block.className = 'block';
                block.innerText = digits[i];
                // 讓每個方塊記住它是屬於哪個玩家的，方便觸控邏輯判斷
                block.dataset.playerId = playerId; 
                
                poolSlot.appendChild(block);
                poolRow.appendChild(poolSlot);
            }
        }

        function submitAnswer(playerId) {
            const btn = document.getElementById(`submit-${playerId}`);
            // 防呆：防止連按
            btn.disabled = true; 
            playClickSound();

            const player = gameState.players[playerId];
            const answerRow = document.getElementById(`answer-row-${playerId}`);
            const poolRow = document.getElementById(`pool-row-${playerId}`);
            
            // 讀取目前在答案槽內的方塊
            const ansSlots = Array.from(answerRow.children);
            let currentAnswer = '';
            let isComplete = true;

            ansSlots.forEach(slot => {
                if (slot.children.length === 0) {
                    isComplete = false;
                } else {
                    currentAnswer += slot.children[0].innerText;
                }
            });

            // 如果沒有填滿，發出警告音並恢復按鈕
            if (!isComplete || currentAnswer.length < gameState.digits) {
                playWrongSound();
                setTimeout(() => { btn.disabled = false; }, 500);
                return;
            }

            // 判斷對錯
            const feedback = document.getElementById(`feedback-${playerId}`);
            
            if (currentAnswer === player.targetAnswer) {
                // 答對了！
                playCorrectSound();
                player.score += 10;
                document.getElementById(`score-${playerId}`).innerText = player.score;
                
                // 顯示大勾勾特效
                feedback.innerHTML = '✔️';
                feedback.className = 'feedback-overlay animate-correct';
                
                // 特效結束後，產生下一題
                setTimeout(() => {
                    feedback.className = 'feedback-overlay';
                    generateQuestion(playerId);
                    btn.disabled = false;
                }, 1500);
            } else {
                // 答錯了...
                playWrongSound();
                player.score = Math.max(0, player.score - 5); // 扣分，最低0分
                document.getElementById(`score-${playerId}`).innerText = player.score;
                
                // 顯示大叉叉特效
                feedback.innerHTML = '❌';
                feedback.className = 'feedback-overlay animate-wrong';
                
                // 將所有方塊退回下方的數字池，讓學生重試
                const poolSlots = Array.from(poolRow.children);
                let poolIndex = 0;
                ansSlots.forEach(slot => {
                    if (slot.children.length > 0) {
                        const block = slot.children[0];
                        // 找一個空的 poolSlot 放回去
                        while(poolIndex < poolSlots.length && poolSlots[poolIndex].children.length > 0) {
                            poolIndex++;
                        }
                        if(poolIndex < poolSlots.length) {
                            poolSlots[poolIndex].appendChild(block);
                        }
                    }
                });

                setTimeout(() => {
                    feedback.className = 'feedback-overlay';
                    btn.disabled = false;
                }, 1500);
            }
        }

        // 使用 Pointer Events 才能完美支援 iPad 上的多根手指同時拖曳不同的方塊
        
        // 紀錄目前活動中的拖曳點 (pointerId -> 相關資料)
        const activePointers = new Map();

        document.addEventListener('pointerdown', (e) => {
            // 如果點擊的目標是數字方塊
            if (e.target.classList.contains('block')) {
                const block = e.target;
                
                // 鎖定指標事件到該元素，確保滑動過快時不會丟失事件
                block.setPointerCapture(e.pointerId);
                
                // 紀錄起始狀態
                activePointers.set(e.pointerId, {
                    block: block,
                    startX: e.clientX,
                    startY: e.clientY,
                    currentX: 0,
                    currentY: 0,
                    originalParent: block.parentNode // 記住它原本屬於哪個槽
                });

                // 加入拖曳中的 CSS 效果
                block.classList.add('dragging');
                block.style.transition = 'none'; // 取消動畫以即時跟隨手指
            }
        });

        document.addEventListener('pointermove', (e) => {
            if (activePointers.has(e.pointerId)) {
                e.preventDefault(); // 防止螢幕捲動
                const data = activePointers.get(e.pointerId);
                
                // 計算位移量
                data.currentX = e.clientX - data.startX;
                data.currentY = e.clientY - data.startY;
                
                // 利用 transform 實現視覺上的移動 (不脫離 DOM 結構，維持排版穩定)
                data.block.style.transform = `translate(${data.currentX}px, ${data.currentY}px)`;
            }
        });

        document.addEventListener('pointerup', handlePointerEnd);
        document.addEventListener('pointercancel', handlePointerEnd);

        function handlePointerEnd(e) {
            if (activePointers.has(e.pointerId)) {
                const data = activePointers.get(e.pointerId);
                const block = data.block;
                const playerId = block.dataset.playerId;
                
                block.releasePointerCapture(e.pointerId);
                activePointers.delete(e.pointerId);
                
                block.classList.remove('dragging');
                
                // 取得方塊目前的中心座標 (視覺位置)
                const rect = block.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                // 找出這個方塊隸屬的玩家面板內所有的「槽 (slot)」
                const playerBoard = document.getElementById(`player-board-${playerId}`);
                const allSlots = playerBoard.querySelectorAll('.slot');
                
                let targetSlot = null;
                
                // 碰撞偵測：看看方塊的中心點掉入哪個槽的範圍內
                allSlots.forEach(slot => {
                    const sRect = slot.getBoundingClientRect();
                    if (centerX >= sRect.left && centerX <= sRect.right &&
                        centerY >= sRect.top && centerY <= sRect.bottom) {
                        targetSlot = slot;
                    }
                });

                // 放開方塊時的處理邏輯
                if (targetSlot) {
                    // 如果目標槽不是原本的槽
                    if (targetSlot !== data.originalParent) {
                        // 如果目標槽裡面已經有別的方塊了，進行「交換」
                        if (targetSlot.children.length > 0) {
                            const existingBlock = targetSlot.children[0];
                            data.originalParent.appendChild(existingBlock);
                        }
                        // 將目前方塊放入目標槽
                        targetSlot.appendChild(block);
                    }
                } 
                // 如果沒有放到任何槽內，DOM 結構不變，下方重置 Transform 時會自動歸位
                
                // 重置位移，讓方塊「貼齊」所屬的槽 (透過 DOM 結構自然排版)
                block.style.transition = 'transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1)';
                block.style.transform = 'translate(0px, 0px)';
                
                // 播放清脆的放下音效
                playClickSound();
            }
        }

        function endGame() {
            clearInterval(gameState.timerId);
            playEndSound();
            
            // 隱藏遊戲區，顯示結算區
            document.getElementById('game-screen').classList.add('hidden');
            const resultScreen = document.getElementById('result-screen');
            resultScreen.classList.remove('hidden');

            const scoreBoard = document.getElementById('result-scores');
            let html = '';
            
            // 如果是多人遊戲，判斷最高分
            let maxScore = -1;
            gameState.players.forEach(p => {
                if(p.score > maxScore) maxScore = p.score;
            });

            // 產生橫向並排的分數卡片，並套用玩家專屬顏色
            gameState.players.forEach(p => {
                let crown = (p.score === maxScore && gameState.playersCount > 1 && maxScore > 0) ? '👑' : '';
                html += `
                    <div class="score-card color-${p.id}">
                        <div class="crown">${crown}</div>
                        <h3>玩家 ${p.id + 1}</h3>
                        <div class="score-number">${p.score} 分</div>
                    </div>
                `;
            });
            scoreBoard.innerHTML = html;
        }

        function backToMenu() {
            playClickSound();
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
        }

    </script>
</body>
</html>
