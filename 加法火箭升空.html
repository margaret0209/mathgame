<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雙人加法火箭升空競賽 (Rocket Addition Showdown)</title>
    <style>
        :root {
            --bg-color: #0b112c;
            --panel-p1: #1a2238;
            --panel-p2: #381a1f;
            --accent-p1: #2980b9;
            --accent-p2: #c0392b;
            --rocket-blue: #3498db;
            --rocket-red: #e74c3c;
            --text-dark: #222222;
            --carry-bg: #ffeaa7;
            --active-border: #ff7675;
            --wrong-color: #d63031;
            --correct-color: #00b894;

            /* 直式的高度 : 數字鍵盤的高度 = 2 : 1 比例變數 */
            --math-col-height: clamp(230px, 34vh, 290px);
            --numpad-height: calc(var(--math-col-height) / 2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        html, body {
            background-color: var(--bg-color);
            height: 100%;
            width: 100%;
            font-family: "Comic Sans MS", "Arial Rounded MT Bold", "PingFang HK", "Microsoft JhengHei", sans-serif;
            color: #fff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 頂部控制列 */
        #top-bar {
            background-color: rgba(14, 20, 45, 0.95);
            padding: 4px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #232b53;
            z-index: 100;
            flex-shrink: 0;
            height: 38px;
        }

        .logo {
            font-size: 1.05rem;
            font-weight: 900;
            color: #f1c40f;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
        }

        .battle-rules-tip {
            font-size: 0.76rem;
            color: #bdc3c7;
            background: rgba(0, 0, 0, 0.45);
            padding: 2px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .battle-rules-tip span {
            color: #f39c12;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.12);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .control-group label {
            font-size: 0.76rem;
            font-weight: bold;
        }

        select {
            font-size: 0.76rem;
            padding: 2px 5px;
            border-radius: 5px;
            border: none;
            outline: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }

        .btn-restart {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.78rem;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(231, 76, 60, 0.4);
            transition: transform 0.1s;
        }

        .btn-restart:active { transform: scale(0.95); }

        /* ==========================================
           中央星空賽道 (Central Space Arena)
           ========================================== */
        #central-track-hud {
            flex-shrink: 0;
            background: radial-gradient(circle at 50% 20%, #0d1b3e 0%, #060914 100%);
            border-bottom: 3px solid #34495e;
            padding: 4px 14px 6px 14px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 4px 25px rgba(0,0,0,0.7);
            overflow: hidden;
            height: clamp(85px, 14vh, 120px);
        }

        .stars-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 160px 20px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 240px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 320px 35px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 450px 60px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 600px 25px, #fff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 750px 80px, #ddd, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 800px 100px;
            opacity: 0.85;
            pointer-events: none;
        }

        .track-labels-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
            color: #8395a7;
            font-weight: 800;
            padding: 0 4px;
            z-index: 5;
        }

        .track-lanes-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            position: relative;
            z-index: 5;
            margin-top: 2px;
        }

        .rocket-lane {
            position: relative;
            height: clamp(26px, 4.2vh, 34px);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 17px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            overflow: visible;
        }

        .lane-progress-bar {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            border-radius: 17px;
            opacity: 0.35;
            transition: width 0.7s cubic-bezier(0.2, 0.8, 0.3, 1);
        }

        .p1-bar { background: linear-gradient(90deg, transparent, #3498db); }
        .p2-bar { background: linear-gradient(90deg, transparent, #e74c3c); }

        .rocket-unit {
            position: absolute;
            left: 0%;
            display: flex;
            align-items: center;
            transform: translateX(0);
            transition: left 0.7s cubic-bezier(0.2, 0.8, 0.3, 1);
            z-index: 10;
        }

        .rocket-sprite {
            font-size: clamp(1.4rem, 2.4vw, 1.8rem);
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.7));
            transform: rotate(45deg);
            display: inline-block;
        }

        .rocket-trail {
            width: 14px;
            height: 8px;
            margin-left: -5px;
            border-radius: 50%;
            background: radial-gradient(circle, #f39c12, #e74c3c, transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .rocket-unit.boosting .rocket-trail {
            opacity: 1;
            animation: flame-pulse 0.12s infinite alternate;
        }

        @keyframes flame-pulse {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.3); opacity: 1; }
        }

        .player-info-pill {
            position: absolute;
            right: 10px;
            font-size: 0.72rem;
            font-weight: bold;
            padding: 1px 7px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 8;
        }

        /* ==========================================
           主答題區佈局：左玩家 | 右玩家
           ========================================== */
        #game-stage {
            flex: 1;
            display: flex;
            flex-direction: row;
            padding: 5px 12px;
            gap: 12px;
            overflow: hidden;
            min-height: 0;
        }

        .player-panel {
            flex: 1;
            background: #ffffff;
            border-radius: 16px;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            padding: 8px 12px 6px 12px;
            position: relative;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
            border: 4px solid;
            min-width: 0;
            min-height: 0;
        }

        #panel-1 { border-color: var(--accent-p1); background: #fbfdff; }
        #panel-2 { border-color: var(--accent-p2); background: #fffbfc; }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 4px;
            margin-bottom: 2px;
            border-bottom: 2px dashed #dcdde1;
            flex-shrink: 0;
        }

        .player-title {
            font-size: 1rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .height-badge {
            font-size: 0.8rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 9px;
            background: #e8f4fd;
            color: #2980b9;
        }

        .player-timer {
            font-size: 0.78rem;
            font-weight: bold;
            padding: 2px 7px;
            border-radius: 8px;
            background: #e8f4fd;
            color: #2980b9;
        }

        .player-timer.fast { background: #e8f8f5; color: #27ae60; }
        .player-timer.slow { background: #fdf2e9; color: #d35400; }

        /* ==========================================================
           直式與鍵盤高度嚴格遵守 2 : 1 比例設定
           ========================================================== */
        .math-section {
            flex: 1;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: clamp(10px, 2.6vw, 28px);
            min-height: 0;
            padding: 4px 0;
            overflow: hidden;
        }

        /* 直式容器：高度佔比 2 */
        .math-column-wrap {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: var(--math-col-height);
            flex: 0 1 auto;
            min-width: 0;
        }

        .math-grid {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
        }

        .math-row {
            display: flex;
            gap: clamp(4px, 0.9vw, 8px);
            justify-content: flex-end;
            width: 100%;
            align-items: center;
        }

        /* 直式單元格大小適配 */
        .math-cell {
            width: clamp(48px, 5.5vw, 68px);
            height: clamp(40px, 5.8vh, 56px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(2rem, 3.8vw, 3rem);
            font-weight: bold;
            border-radius: 9px;
            position: relative;
            color: #2d3436;
        }

        .header-cell {
            font-size: clamp(0.9rem, 1.4vw, 1.2rem);
            color: #7f8c8d;
            height: clamp(18px, 2.6vh, 26px);
            font-weight: bold;
        }

        .symbol-cell {
            color: #2d3436;
            justify-content: flex-start;
        }

        .divider-row {
            border-bottom: clamp(3px, 0.5vh, 5px) solid #2d3436;
            margin: clamp(1px, 0.2vh, 2px) 0;
            width: 100%;
        }

        /* [進位] 按鈕 */
        .carry-btn {
            background-color: #f1f2f6;
            border: 2px dashed #a4b0be;
            color: #747d8c;
            font-size: clamp(0.72rem, 1vw, 0.92rem);
            border-radius: 50%;
            width: clamp(36px, 4.2vw, 48px);
            height: clamp(36px, 4.2vw, 48px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            font-weight: bold;
        }

        .carry-btn.active-carry {
            background-color: var(--carry-bg);
            border: 2px solid #e67e22;
            color: #d35400;
            font-size: clamp(1.35rem, 2.2vw, 1.8rem);
        }

        /* 答案輸入方格 */
        .answer-box {
            border: 3px dashed #b2bec3;
            background-color: #f8f9fa;
            cursor: pointer;
        }

        .answer-box.selected {
            border: 3px solid var(--active-border) !important;
            background-color: #ffffff !important;
            box-shadow: 0 0 10px rgba(255, 118, 117, 0.55);
        }

        .answer-box.filled {
            border-style: solid;
            border-color: #74b9ff;
            background-color: #f1f6ff;
        }

        .answer-box.empty-leading {
            border: 2px dashed #dfe6e9;
            background-color: #fafbfc;
            color: #b2bec3;
        }

        .cell-wrong {
            border: 3px solid var(--wrong-color) !important;
            background-color: #ffe6e6 !important;
            color: var(--wrong-color) !important;
        }

        .cell-correct {
            border: 3px solid var(--correct-color) !important;
            background-color: #e8f8f5 !important;
            color: var(--correct-color) !important;
        }

        /* 數字鍵盤容器：高度佔比 1（正好為直式高度的 50%） */
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: clamp(3px, 0.4vw, 5px);
            width: clamp(120px, 14.5vw, 160px);
            height: var(--numpad-height); /* 精準 2:1 比例 */
            flex-shrink: 0;
        }

        .numpad-btn {
            background-color: #e2d1f9;
            border: 1.5px solid #b898eb;
            border-radius: 7px;
            height: 100%;
            font-size: clamp(0.95rem, 1.5vw, 1.25rem);
            font-weight: bold;
            color: #2d3436;
            box-shadow: 0 2px 0 #b898eb;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.08s;
        }

        .numpad-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 #b898eb;
        }

        .numpad-btn.btn-clear {
            background-color: #ffb7b2;
            border-color: #f7908a;
            box-shadow: 0 2px 0 #f7908a;
            font-size: clamp(0.8rem, 1vw, 0.95rem);
        }

        .numpad-btn.btn-submit-key {
            background-color: #2ed573;
            border-color: #20af5c;
            color: white;
            box-shadow: 0 2px 0 #1b8a49;
            font-size: clamp(0.82rem, 1.05vw, 0.96rem);
            letter-spacing: 0.5px;
        }

        .numpad-btn.btn-retry-mode {
            background-color: #ffa502 !important;
            border-color: #e67e22 !important;
            box-shadow: 0 2px 0 #d35400 !important;
        }

        .numpad-btn.btn-next-mode {
            background-color: #3498db !important;
            border-color: #2980b9 !important;
            box-shadow: 0 2px 0 #1f618d !important;
            font-size: clamp(0.78rem, 0.95vw, 0.9rem) !important;
        }

        .action-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 2px;
            border-top: 1px dashed #ecf0f1;
            flex-shrink: 0;
        }

        .chance-badge {
            font-size: clamp(0.72rem, 1vw, 0.82rem);
            color: #e74c3c;
            font-weight: bold;
            min-height: 18px;
            text-align: center;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .shake { animation: shake 0.4s; }

        /* 獲勝結算彈窗 */
        .win-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 11, 18, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
            z-index: 500;
            text-align: center;
            padding: 20px;
        }

        .win-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .win-trophy {
            font-size: clamp(3.5rem, 8vw, 5.5rem);
            animation: bounce 0.6s infinite alternate ease-in-out;
            margin-bottom: 8px;
        }

        @keyframes bounce {
            0% { transform: scale(1); }
            100% { transform: scale(1.12); }
        }

        .win-desc {
            font-size: clamp(1.6rem, 3.4vw, 2.5rem);
            font-weight: bold;
            color: #ffeaa7;
            margin-bottom: 6px;
        }

        .win-sub {
            font-size: clamp(0.95rem, 1.8vw, 1.25rem);
            color: #ced6e0;
            margin-bottom: 22px;
        }

        @media (max-width: 900px) {
            #game-stage { gap: 8px; padding: 4px 6px; }
            .player-panel { padding: 6px 8px; }
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="logo">🚀 雙人加法火箭升空競賽</div>
        <div class="battle-rules-tip">
            衝出大氣層 (100km) 獲勝！⚡ 5秒速答 <span>+20km</span> | ⌛ 5秒以上 <span>+10km</span>
        </div>
        <div class="controls">
            <div class="control-group">
                <label>位數：</label>
                <select id="sel-level">
                    <option value="2" selected>兩位數</option>
                    <option value="3">三位數</option>
                    <option value="4">四位數</option>
                    <option value="5">五位數</option>
                </select>
            </div>
            <button class="btn-restart" onclick="restartMatch()">重新開戰</button>
        </div>
    </div>

    <!-- 中央星空賽道 (Central Space Arena) -->
    <div id="central-track-hud">
        <div class="stars-bg"></div>

        <div class="track-labels-row">
            <span>🌱 地表 (0km)</span>
            <span>☁️ 雲層 (30km)</span>
            <span>🪐 大氣頂部 (70km)</span>
            <span>🌌 宇宙邊界 (100km) 🏁</span>
        </div>

        <div class="track-lanes-container">
            <!-- 藍方火箭軌道 -->
            <div class="rocket-lane">
                <div class="lane-progress-bar p1-bar" id="p1-progress-bar" style="width: 0%;"></div>
                <div class="rocket-unit" id="rocket-unit-1" style="left: 0%;">
                    <span class="rocket-sprite">🚀</span>
                    <div class="rocket-trail"></div>
                </div>
                <div class="player-info-pill" style="color: #74b9ff;">P1 藍色火箭</div>
            </div>

            <!-- 紅方火箭軌道 -->
            <div class="rocket-lane">
                <div class="lane-progress-bar p2-bar" id="p2-progress-bar" style="width: 0%;"></div>
                <div class="rocket-unit" id="rocket-unit-2" style="left: 0%;">
                    <span class="rocket-sprite">🚀</span>
                    <div class="rocket-trail"></div>
                </div>
                <div class="player-info-pill" style="color: #ff7675;">P2 紅色火箭</div>
            </div>
        </div>
    </div>

    <!-- 底部主答題區 -->
    <div id="game-stage">
        <!-- 左邊：玩家 1 作答版面 -->
        <div id="panel-1" class="player-panel">
            <div class="player-header">
                <div class="player-title">
                    <span>🚀 玩家 1 (藍方)</span>
                    <span class="height-badge" id="height-1">高度: 0 km</span>
                </div>
                <div class="player-timer" id="timer-1">用時: 0.0s</div>
            </div>

            <!-- 直式 (高度 2) 與 數字鍵盤 (高度 1) = 2:1 -->
            <div class="math-section">
                <div class="math-column-wrap">
                    <div class="math-grid" id="grid-1"></div>
                </div>
                <div class="numpad" id="numpad-1"></div>
            </div>

            <div class="action-area">
                <div class="chance-badge" id="chance-1">剩餘修改機會：1 次</div>
            </div>
        </div>

        <!-- 右邊：玩家 2 作答版面 -->
        <div id="panel-2" class="player-panel">
            <div class="player-header">
                <div class="player-title">
                    <span>🚀 玩家 2 (紅方)</span>
                    <span class="height-badge" id="height-2">高度: 0 km</span>
                </div>
                <div class="player-timer" id="timer-2">用時: 0.0s</div>
            </div>

            <!-- 直式 (高度 2) 與 數字鍵盤 (高度 1) = 2:1 -->
            <div class="math-section">
                <div class="math-column-wrap">
                    <div class="math-grid" id="grid-2"></div>
                </div>
                <div class="numpad" id="numpad-2"></div>
            </div>

            <div class="action-area">
                <div class="chance-badge" id="chance-2">剩餘修改機會：1 次</div>
            </div>
        </div>
    </div>

    <!-- 獲勝結算彈窗 -->
    <div class="win-overlay" id="win-overlay">
        <div class="win-trophy">🏆</div>
        <div class="win-desc" id="win-title">玩家 1 獲勝！</div>
        <div class="win-sub" id="win-subtitle">率先衝破大氣層，成功抵達宇宙！</div>
        <button class="btn-restart" style="font-size:1.1rem; padding:9px 24px;" onclick="restartMatch()">再戰一回合</button>
    </div>

    <script>
        // ==========================================
        // 音效系統
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTone(freq, type, duration) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        const Sound = {
            click: () => playTone(480, 'sine', 0.06),
            boost: () => {
                playTone(320, 'sine', 0.12);
                setTimeout(() => playTone(540, 'triangle', 0.18), 60);
                setTimeout(() => playTone(820, 'sine', 0.25), 140);
            },
            wrong: () => playTone(150, 'sawtooth', 0.35),
            win: () => {
                [440, 554, 659, 880, 1100].forEach((f, i) => {
                    setTimeout(() => playTone(f, 'triangle', 0.22), i * 110);
                });
            }
        };

        const PLACE_LABELS = ["個", "十", "百", "千", "萬"];
        let matchConfig = {
            level: 2,
            targetDistance: 100 // 衝過 100km 獲勝
        };

        let isGameOver = false;

        class RocketPlayer {
            constructor(id) {
                this.id = id;
                this.distance = 0; // 當前公里數

                this.gridEl = document.getElementById(`grid-${id}`);
                this.numpadEl = document.getElementById(`numpad-${id}`);
                this.chanceEl = document.getElementById(`chance-${id}`);
                this.timerEl = document.getElementById(`timer-${id}`);
                this.heightEl = document.getElementById(`height-${id}`);
                this.rocketUnitEl = document.getElementById(`rocket-unit-${id}`);
                this.progressBarEl = document.getElementById(`p${id}-progress-bar`);
                this.submitBtn = null;

                this.num1 = [];
                this.num2 = [];
                this.carries = [];
                this.answers = [];
                this.expectedDigits = []; // 標準答案陣列 (已去除前導零)
                this.carryErrors = [];
                this.ansErrors = [];

                this.currentSelectedCol = 0;
                this.modifyChances = 1;
                this.isDisplayingAnswer = false;

                // 計時器
                this.startTime = null;
                this.timerInterval = null;
                this.elapsedSeconds = 0;

                this.initNumpad();
                this.generateNewQuestion();
            }

            initNumpad() {
                this.numpadEl.innerHTML = '';
                const layout = [1, 2, 3, 4, 5, 6, 7, 8, 9, "清除", 0, "提交"];
                layout.forEach(item => {
                    const btn = document.createElement('div');
                    btn.className = 'numpad-btn';

                    if (item === "清除") {
                        btn.classList.add('btn-clear');
                        btn.textContent = item;
                        btn.addEventListener('pointerdown', (e) => {
                            e.preventDefault();
                            Sound.click();
                            this.handleKeypad(item);
                        });
                    } else if (item === "提交") {
                        btn.classList.add('btn-submit-key');
                        btn.textContent = "提交";
                        this.submitBtn = btn;
                        btn.addEventListener('pointerdown', (e) => {
                            e.preventDefault();
                            this.handleActionClick();
                        });
                    } else {
                        btn.textContent = item;
                        btn.addEventListener('pointerdown', (e) => {
                            e.preventDefault();
                            Sound.click();
                            this.handleKeypad(item);
                        });
                    }
                    this.numpadEl.appendChild(btn);
                });
            }

            startTimer() {
                if (this.timerInterval) clearInterval(this.timerInterval);
                this.startTime = Date.now();
                this.timerInterval = setInterval(() => {
                    if (isGameOver) return;
                    let diff = (Date.now() - this.startTime) / 1000;
                    this.elapsedSeconds = diff;
                    this.timerEl.textContent = `用時: ${diff.toFixed(1)}s`;
                    if (diff <= 5.0) {
                        this.timerEl.className = 'player-timer fast';
                    } else {
                        this.timerEl.className = 'player-timer slow';
                    }
                }, 100);
            }

            stopTimer() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
            }

            // 題庫生成：隨機出現「進位」（約70%）與「不用進位」（約30%）
            // 最高位不為 1，兩位數和嚴格維持兩位數 (< 10^lvl)
            // 同時計算合乎數字定義的有效數位（去除前導零）
            generateNewQuestion() {
                if (isGameOver) return;
                let lvl = matchConfig.level;
                this.num1 = [];
                this.num2 = [];
                this.carries = Array(lvl + 1).fill(0); 
                this.answers = Array(lvl).fill(null);
                this.carryErrors = Array(lvl + 1).fill(false);
                this.ansErrors = Array(lvl).fill(false);
                this.modifyChances = 1;
                this.isDisplayingAnswer = false;
                this.currentSelectedCol = 0;

                // 約 30% 機率生成「不用進位」的算式，70% 為「有進位」算式
                let wantNoCarry = Math.random() < 0.30;
                let found = false;
                let attempts = 0;

                while (!found && attempts < 10000) {
                    attempts++;
                    // 最高位限制為 2 ~ 9 (排除 1)
                    let h1 = 2 + Math.floor(Math.random() * 8);
                    let h2 = 2 + Math.floor(Math.random() * 8);

                    let low1 = [];
                    let low2 = [];
                    for (let i = 0; i < lvl - 1; i++) {
                        low1.push(Math.floor(Math.random() * 10));
                        low2.push(Math.floor(Math.random() * 10));
                    }

                    let val1 = h1 * Math.pow(10, lvl - 1);
                    let val2 = h2 * Math.pow(10, lvl - 1);
                    for (let i = 0; i < lvl - 1; i++) {
                        val1 += low1[i] * Math.pow(10, i);
                        val2 += low2[i] * Math.pow(10, i);
                    }

                    let totalSum = val1 + val2;

                    // 確保加法結果維持在 lvl 位數 (< 10^lvl)
                    if (totalSum < Math.pow(10, lvl)) {
                        let arr1 = [...low1, h1];
                        let arr2 = [...low2, h2];

                        // 檢查此題目是否有進位
                        let hasCarry = false;
                        let cCheck = 0;
                        for (let i = 0; i < lvl; i++) {
                            if ((arr1[i] || 0) + (arr2[i] || 0) + cCheck > 9) {
                                hasCarry = true;
                                break;
                            }
                            cCheck = Math.floor(((arr1[i] || 0) + (arr2[i] || 0) + cCheck) / 10);
                        }

                        if (wantNoCarry) {
                            if (!hasCarry) {
                                this.num1 = arr1;
                                this.num2 = arr2;
                                found = true;
                            }
                        } else {
                            if (hasCarry) {
                                this.num1 = arr1;
                                this.num2 = arr2;
                                found = true;
                            }
                        }
                    }
                }

                // 防呆：若特殊條件未能在限制內配對，退回有效算式
                if (!found) {
                    let h1 = 2 + Math.floor(Math.random() * 8);
                    let maxH2 = Math.min(9, Math.floor(9 - h1));
                    let h2 = maxH2 >= 2 ? (2 + Math.floor(Math.random() * (maxH2 - 1))) : 2;
                    let low1 = Array(lvl - 1).fill(0);
                    let low2 = Array(lvl - 1).fill(0);
                    this.num1 = [...low1, h1];
                    this.num2 = [...low2, h2];
                }

                // 計算正解位數並處理「符合數字定義（消除前導零 0456 -> 456）」
                this.calculateExpectedDigits();

                if (this.submitBtn) {
                    this.submitBtn.className = 'numpad-btn btn-submit-key';
                    this.submitBtn.textContent = "提交";
                }
                this.chanceEl.textContent = "剩餘修改機會：1 次";
                this.renderGrid();
                this.startTimer();
            }

            // 計算標準正確答案及進位，並符合數字定義去除前導零
            calculateExpectedDigits() {
                let lvl = matchConfig.level;
                let cTemp = 0;
                let rawDigits = [];
                this.correctCarries = Array(lvl + 1).fill(0);

                for (let i = 0; i < lvl; i++) {
                    this.correctCarries[i] = cTemp;
                    let sum = (this.num1[i] || 0) + (this.num2[i] || 0) + cTemp;
                    rawDigits.push(sum % 10);
                    cTemp = sum > 9 ? 1 : 0;
                }
                this.correctCarries[lvl] = cTemp;

                // 判斷最高有效位，移除高位前導零
                let highestValidIndex = 0;
                for (let i = lvl - 1; i >= 0; i--) {
                    if (rawDigits[i] !== 0) {
                        highestValidIndex = i;
                        break;
                    }
                }

                this.expectedDigits = Array(lvl).fill(null);
                for (let i = 0; i < lvl; i++) {
                    if (i <= highestValidIndex) {
                        this.expectedDigits[i] = rawDigits[i];
                    } else {
                        // 高於最高有效位的為前導零，合乎數字定義，標準為空 (null)
                        this.expectedDigits[i] = null;
                    }
                }
            }

            handleKeypad(val) {
                if (this.isDisplayingAnswer || isGameOver) return;

                if (val === "清除") {
                    this.answers[this.currentSelectedCol] = null;
                    this.ansErrors[this.currentSelectedCol] = false;
                } else if (typeof val === 'number') {
                    this.answers[this.currentSelectedCol] = val;
                    this.ansErrors[this.currentSelectedCol] = false;

                    if (this.currentSelectedCol < matchConfig.level - 1) {
                        this.currentSelectedCol++;
                    }
                }
                this.renderGrid();
            }

            toggleCarry(col) {
                if (this.isDisplayingAnswer || isGameOver) return;
                Sound.click();
                this.carries[col] = (this.carries[col] === 1) ? 0 : 1;
                this.carryErrors[col] = false;
                this.renderGrid();
            }

            renderGrid() {
                this.gridEl.innerHTML = '';
                let maxCol = matchConfig.level;
                let rows = [[], [], [], [], [], []];

                for (let c = maxCol; c >= 0; c--) {
                    let isSymbolCol = (c === maxCol);

                    // 1. 表頭（位值標籤：個、十、百、千、萬）
                    let hCell = document.createElement('div');
                    hCell.className = 'math-cell header-cell';
                    hCell.textContent = isSymbolCol ? "" : PLACE_LABELS[c];
                    rows[0].push(hCell);

                    // 2. 進位按鈕列
                    let carryCell = document.createElement('div');
                    carryCell.className = 'math-cell';
                    if (!isSymbolCol && c > 0) {
                        let isCarried = this.carries[c] === 1;
                        let carryBtn = document.createElement('button');
                        carryBtn.className = 'carry-btn' + (isCarried ? ' active-carry' : '');
                        carryBtn.textContent = isCarried ? "1" : "進位";
                        carryBtn.onclick = () => this.toggleCarry(c);

                        if (this.carryErrors[c]) {
                            carryBtn.classList.add('cell-wrong');
                        } else if (this.isDisplayingAnswer && isCarried) {
                            carryBtn.classList.add('cell-correct');
                        }
                        carryCell.appendChild(carryBtn);
                    }
                    rows[1].push(carryCell);

                    // 3. 被加數
                    let n1Cell = document.createElement('div');
                    n1Cell.className = 'math-cell';
                    n1Cell.textContent = !isSymbolCol ? this.num1[c] : "";
                    rows[2].push(n1Cell);

                    // 4. 加數與加號
                    let n2Cell = document.createElement('div');
                    n2Cell.className = 'math-cell';
                    if (isSymbolCol) {
                        n2Cell.textContent = "+";
                        n2Cell.classList.add('symbol-cell');
                    } else {
                        n2Cell.textContent = this.num2[c] !== undefined ? this.num2[c] : "";
                    }
                    rows[3].push(n2Cell);

                    // 5. 答案列
                    let ansCell = document.createElement('div');
                    ansCell.className = 'math-cell';
                    if (!isSymbolCol) {
                        let aBox = document.createElement('div');
                        aBox.className = 'math-cell answer-box';

                        let currentVal = this.answers[c];
                        if (currentVal !== null && currentVal !== undefined) {
                            aBox.textContent = currentVal;
                            aBox.classList.add('filled');
                        } else {
                            // 若此格在正解中是前導零且公佈答案時，維持簡潔空框
                            if (this.isDisplayingAnswer && this.expectedDigits[c] === null) {
                                aBox.classList.add('empty-leading');
                            }
                        }

                        if (this.currentSelectedCol === c && !this.isDisplayingAnswer) {
                            aBox.classList.add('selected');
                        }

                        aBox.onclick = () => {
                            if (this.isDisplayingAnswer || isGameOver) return;
                            this.currentSelectedCol = c;
                            this.renderGrid();
                        };

                        if (this.ansErrors[c]) {
                            aBox.classList.add('cell-wrong');
                        } else if (this.isDisplayingAnswer) {
                            if (this.expectedDigits[c] !== null) {
                                aBox.classList.add('cell-correct');
                            }
                        }
                        ansCell.appendChild(aBox);
                    }
                    rows[5].push(ansCell);
                }

                rows.forEach((rowEls, idx) => {
                    if (idx === 4) {
                        let divLine = document.createElement('div');
                        divLine.className = 'divider-row';
                        this.gridEl.appendChild(divLine);
                    } else {
                        let rowDiv = document.createElement('div');
                        rowDiv.className = 'math-row';
                        rowEls.forEach(el => rowDiv.appendChild(el));
                        this.gridEl.appendChild(rowDiv);
                    }
                });
            }

            handleActionClick() {
                if (isGameOver) return;
                if (this.isDisplayingAnswer) {
                    this.generateNewQuestion();
                    return;
                }
                this.submitAndVerify();
            }

            submitAndVerify() {
                let lvl = matchConfig.level;
                let hasError = false;
                this.ansErrors = Array(lvl).fill(false);
                this.carryErrors = Array(lvl + 1).fill(false);

                // 核心驗證：答案合乎數字定義（排除前導零）
                for (let i = 0; i < lvl; i++) {
                    let expectedVal = this.expectedDigits[i];
                    let userVal = this.answers[i];

                    if (expectedVal !== null) {
                        // 有效數位：學生必須填入正確數字，未填或填錯均判錯
                        if (userVal === null || userVal === undefined || userVal !== expectedVal) {
                            this.ansErrors[i] = true;
                            hasError = true;
                        }
                    } else {
                        // 前導零位置：合乎數字定義不能寫 0，若學生寫了 0 或其他數字則判定為錯誤
                        if (userVal !== null && userVal !== undefined) {
                            this.ansErrors[i] = true;
                            hasError = true;
                        }
                    }

                    if (i > 0 && this.carries[i] !== this.correctCarries[i]) {
                        this.carryErrors[i] = true;
                        hasError = true;
                    }
                }

                if (!hasError) {
                    // 全部正確：火箭注入燃料噴射升空
                    this.stopTimer();

                    let boostKm = (this.elapsedSeconds <= 5.0) ? 20 : 10;
                    this.distance = Math.min(matchConfig.targetDistance, this.distance + boostKm);
                    this.updateRocketUI(boostKm);

                    let successMsg = (this.elapsedSeconds <= 5.0) ? "⚡ 5秒極速！火箭推進 +20km" : "🚀 答對！火箭推進 +10km";
                    this.chanceEl.textContent = successMsg;

                    if (this.submitBtn) this.submitBtn.classList.add('disabled');
                    setTimeout(() => {
                        if (!isGameOver) this.generateNewQuestion();
                    }, 1200);
                } else {
                    // 答錯處理
                    Sound.wrong();

                    let activePanel = document.getElementById(`panel-${this.id}`);
                    activePanel.classList.add('shake');
                    setTimeout(() => activePanel.classList.remove('shake'), 400);

                    if (this.modifyChances > 0) {
                        this.modifyChances--;
                        this.chanceEl.textContent = "請修正紅框標示處！剩餘修改機會：0 次";
                        if (this.submitBtn) {
                            this.submitBtn.textContent = "重交";
                            this.submitBtn.classList.add('btn-retry-mode');
                        }
                        for (let i = 0; i < lvl; i++) {
                            if (this.ansErrors[i]) {
                                this.currentSelectedCol = i;
                                break;
                            }
                        }
                        this.renderGrid();
                    } else {
                        // 第二次答錯，直接給予標準答案（符合數字定義），並提供「下一題」按鈕
                        this.stopTimer();
                        this.isDisplayingAnswer = true;
                        this.ansErrors = Array(lvl).fill(false);
                        this.carryErrors = Array(lvl + 1).fill(false);

                        // 答案填入去除前導零的正解
                        this.answers = [...this.expectedDigits];
                        this.carries = [...this.correctCarries];

                        this.chanceEl.textContent = "💡 已顯示符合定義之正解，觀察後按『下一題』！";
                        if (this.submitBtn) {
                            this.submitBtn.className = 'numpad-btn btn-submit-key btn-next-mode';
                            this.submitBtn.textContent = "下一題";
                        }
                        this.renderGrid();
                    }
                }
            }

            updateRocketUI(boostKm = 0) {
                this.heightEl.textContent = `高度: ${this.distance} km`;

                let percentage = (this.distance / matchConfig.targetDistance) * 88; // 最大移動至 88% 位置
                this.progressBarEl.style.width = `${(this.distance / matchConfig.targetDistance) * 100}%`;
                this.rocketUnitEl.style.left = `${percentage}%`;

                if (boostKm > 0) {
                    Sound.boost();
                    this.rocketUnitEl.classList.add('boosting');
                    setTimeout(() => {
                        this.rocketUnitEl.classList.remove('boosting');
                    }, 700);
                }

                if (this.distance >= matchConfig.targetDistance && !isGameOver) {
                    isGameOver = true;
                    Sound.win();
                    setTimeout(() => declareWinner(this.id), 500);
                }
            }
        }

        let players = [];

        function declareWinner(winnerId) {
            const overlay = document.getElementById('win-overlay');
            const title = document.getElementById('win-title');
            const subtitle = document.getElementById('win-subtitle');

            const winnerColor = winnerId === 1 ? '藍色火箭 (P1)' : '紅色火箭 (P2)';
            title.textContent = `🏆 ${winnerColor} 獲勝！`;
            subtitle.textContent = `率先成功突破大氣層，成功抵達宇宙！🌌`;
            overlay.classList.add('show');
        }

        function restartMatch() {
            isGameOver = false;
            document.getElementById('win-overlay').classList.remove('show');
            players.forEach(p => {
                p.stopTimer();
                p.distance = 0;
                p.updateRocketUI();
                p.generateNewQuestion();
            });
        }

        function initApp() {
            players = [new RocketPlayer(1), new RocketPlayer(2)];

            document.getElementById('sel-level').addEventListener('change', (e) => {
                matchConfig.level = parseInt(e.target.value);
                restartMatch();
            });
        }

        window.onload = initApp;
    </script>
</body>
