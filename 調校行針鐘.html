<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>調校行針鐘</title>
<style>
  /* ====================================================
     1. 馬卡龍柔和主題色彩 (Macaron Pastel Theme)
     ==================================================== */
  :root {
    --macaron-bg: #FFFBF2;         /* 奶油米黃背景 */
    --macaron-frame-bg: #FFF6EC;   /* 主框架底色 */
    --macaron-top-bg: #FFD6E0;     /* 上方控制列粉紅 */
    --macaron-p1-bg: #E8F4F8;      /* 玩家1淡藍底 */
    --macaron-p2-bg: #EAF7ED;      /* 玩家2淡綠底 */
    
    --macaron-yellow: #FCF6BD;    /* 馬卡龍黃 */
    --macaron-yellow-shadow: #E2DA99;
    
    --macaron-pink: #F8C8DC;      /* 時針/按鈕粉紅 */
    --macaron-pink-shadow: #DDA1B9;
    
    --macaron-blue: #A9DEF9;      /* 分針/按鈕粉藍 */
    --macaron-blue-shadow: #7DC0E3;
    
    --macaron-purple: #E4C1F9;    /* 選中態紫色 */
    --macaron-purple-shadow: #B288CF;
    
    --macaron-green: #D0F4DE;     /* 核對答案按鈕粉綠 */
    --macaron-green-shadow: #97D8A9;
    
    --text-dark: #3D3D3D;         /* 深灰文字 */
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  /* 頁面佈局：強制頂部對齊 (flex-start)，去除頁首過多空白 */
  html, body {
    margin: 0;
    padding: 8px 0 0 0; /* 極微量頂部邊距，讓整體向上靠齊 */
    width: 100vw;
    height: 100vh;
    background-color: var(--macaron-bg);
    background-image: radial-gradient(#F5E6D3 18%, transparent 19%), radial-gradient(#F5E6D3 18%, transparent 19%);
    background-size: 28px 28px;
    background-position: 0 0, 14px 14px;
    font-family: 'PingFang HK', 'Microsoft JhengHei', 'Comic Sans MS', sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: flex-start; /* 整個畫面向上靠齊 */
    align-items: center;
    overflow: hidden; /* 徹底禁止全頁捲動 */
    user-select: none;
    touch-action: none;
  }

  /* 主遊戲容器：嚴格限制高度 85vh */
  #game-container {
    width: 98vw;
    max-width: 1200px;
    height: 85vh;
    max-height: 85vh;
    background: var(--macaron-frame-bg);
    border: 4px solid #FFFFFF;
    border-radius: 24px;
    box-shadow: 0 8px 28px rgba(180, 150, 130, 0.2);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* 上方控制列 (緊貼頂部，高對比大按鈕) */
  #top-area {
    height: 12%;
    min-height: 46px;
    background: var(--macaron-top-bg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    z-index: 10;
  }

  .top-group {
    display: flex;
    align-items: center;
    gap: 5px;
    background: rgba(255, 255, 255, 0.85);
    padding: 3px 8px;
    border-radius: 18px;
  }

  .top-label {
    font-size: clamp(0.85rem, 1.8vh, 1.05rem);
    font-weight: 800;
    color: var(--text-dark);
  }

  /* 馬卡龍按鈕基本樣式 */
  .m-btn {
    background: var(--macaron-yellow);
    border: none;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: clamp(0.8rem, 1.7vh, 1rem);
    font-weight: 800;
    color: var(--text-dark);
    cursor: pointer;
    box-shadow: 0 3px 0 var(--macaron-yellow-shadow);
    transition: transform 0.05s, box-shadow 0.05s;
    touch-action: manipulation;
  }

  .m-btn:active {
    transform: translateY(3px);
    box-shadow: 0 0 0 var(--macaron-yellow-shadow);
  }

  .m-btn.active {
    background: var(--macaron-purple);
    box-shadow: 0 3px 0 var(--macaron-purple-shadow);
    color: #2E1B38;
  }

  .m-btn.action-btn {
    background: #FFB5A7;
    box-shadow: 0 3px 0 #D88E80;
    color: #FFFFFF;
  }

  /* 下方主遊戲區域 */
  #bottom-area {
    height: 88%;
    flex: 1;
    display: flex;
    flex-direction: row;
    overflow: hidden;
    position: relative;
  }

  /* 玩家卡片 */
  .player-card {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px 10px 12px;
    position: relative;
    overflow: hidden;
  }

  #p1-card {
    background: var(--macaron-p1-bg);
  }

  #p2-card {
    background: var(--macaron-p2-bg);
    border-left: 3px dashed rgba(160, 200, 180, 0.4);
  }

  .hidden {
    display: none !important;
  }

  /* 題目與分數 */
  .header-info {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
  }

  .score-badge {
    background: #FFFFFF;
    padding: 3px 10px;
    border-radius: 14px;
    font-size: clamp(0.85rem, 1.9vh, 1.05rem);
    font-weight: 800;
    color: #FF8800;
    box-shadow: 0 2px 5px rgba(0,0,0,0.04);
  }

  .question-box {
    background: #FFFFFF;
    border: 3px solid #FFF;
    border-radius: 18px;
    padding: 3px 20px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    text-align: center;
  }

  .question-title {
    font-size: clamp(1.2rem, 3.2vh, 2.1rem);
    font-weight: 900;
    color: #2B2B2B;
    letter-spacing: 1px;
  }

  /* 鐘面外圍彈性容器 */
  .clock-stage {
    flex: 1;
    width: 100%;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    padding: 10px 0;
  }

  /* 鐘面與控制器的正方形包裹層，確保按鈕完美貼合角落 */
  .clock-wrapper {
    position: relative;
    height: 100%;
    max-width: 100%;
    aspect-ratio: 1 / 1;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .svg-container {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .svg-container svg {
    max-height: 100%;
    max-width: 100%;
    aspect-ratio: 1 / 1;
    filter: drop-shadow(0 5px 12px rgba(0,0,0,0.08));
  }

  /* 放置在角落的控制器 */
  .corner-control {
    position: absolute;
    bottom: 0%; /* 貼底放置，避免超出卡片邊界 */
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px; /* 縮小垂直間距 */
    background: rgba(255, 255, 255, 0.9);
    padding: 5px 6px; /* 縮小內距 */
    border-radius: 14px; /* 調整為較小的圓角 */
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    backdrop-filter: blur(4px);
    z-index: 20;
  }

  .left-control {
    left: 0;
  }

  .right-control {
    right: 0;
  }

  .control-title {
    font-size: clamp(0.8rem, 1.6vh, 1rem); /* 縮小標題字體 */
    font-weight: 900;
  }

  .btn-pair {
    display: flex;
    gap: 5px; /* 縮小按鈕橫向間距 */
  }

  /* 微調按鈕：縮小比例以免遮蓋提示數字 */
  .adj-btn {
    width: clamp(32px, 4.5vh, 42px);
    height: clamp(32px, 4.5vh, 42px);
    border-radius: 10px;
    border: none;
    font-size: clamp(1.2rem, 2.5vh, 1.8rem);
    font-weight: 900;
    color: #333;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.05s, box-shadow 0.05s;
  }

  /* 時針按鈕 (珊瑚粉) */
  .adj-btn.hour-btn {
    background: var(--macaron-pink);
    box-shadow: 0 4px 0 var(--macaron-pink-shadow);
  }
  .adj-btn.hour-btn:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 var(--macaron-pink-shadow);
  }

  /* 分針按鈕 (薄荷藍) */
  .adj-btn.min-btn {
    background: var(--macaron-blue);
    box-shadow: 0 4px 0 var(--macaron-blue-shadow);
  }
  .adj-btn.min-btn:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 var(--macaron-blue-shadow);
  }

  /* 核對答案按鈕 */
  .submit-btn {
    width: 98%;
    max-width: 440px;
    background: var(--macaron-green);
    box-shadow: 0 5px 0 var(--macaron-green-shadow);
    color: #1E4620;
    font-size: clamp(1rem, 2.4vh, 1.4rem);
    font-weight: 900;
    padding: 8px 0;
    border-radius: 16px;
    border: none;
    margin-top: 5px;
    cursor: pointer;
    touch-action: manipulation;
    z-index: 10;
  }

  .submit-btn:active {
    transform: translateY(5px);
    box-shadow: 0 0 0 var(--macaron-green-shadow);
  }

  /* 反饋動畫遮罩 */
  .feedback-overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(255, 255, 255, 0.94);
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    border-radius: 20px;
  }

  .feedback-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .feedback-emoji {
    font-size: clamp(3.5rem, 13vh, 7rem);
    animation: popScale 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .feedback-text {
    font-size: clamp(1.2rem, 3vh, 1.9rem);
    font-weight: 900;
    margin-top: 6px;
    color: #333;
  }

  @keyframes popScale {
    0% { transform: scale(0); }
    80% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
</style>
</head>
<body>

<div id="game-container">
  
  <!-- 上方控制列 (頂部對齊) -->
  <div id="top-area">
    <!-- 關卡選擇 -->
    <div class="top-group">
      <span class="top-label">關卡：</span>
      <button id="lvl-btn-0" class="m-btn active" onclick="selectLevel(0)">時正</button>
      <button id="lvl-btn-1" class="m-btn" onclick="selectLevel(1)">時半</button>
      <button id="lvl-btn-2" class="m-btn" onclick="selectLevel(2)">時與分</button>
    </div>

    <!-- 人數模式 -->
    <div class="top-group">
      <span class="top-label">人數：</span>
      <button id="mode-btn-1" class="m-btn active" onclick="selectMode(1)">1人</button>
      <button id="mode-btn-2" class="m-btn" onclick="selectMode(2)">2人</button>
    </div>

    <!-- 提示、音效與換題 -->
    <div style="display: flex; gap: 5px;">
      <button id="prompt-btn" class="m-btn" onclick="togglePrompt()">💡 提示：關</button>
      <button id="sound-btn" class="m-btn active" onclick="toggleSound()">🔊 音效：開</button>
      <button class="m-btn action-btn" onclick="refreshAllQuestions()">🔄 換題</button>
    </div>
  </div>

  <!-- 下方遊戲主區域 -->
  <div id="bottom-area">
    
    <!-- 玩家一區域 (P1) -->
    <div id="p1-card" class="player-card">
      <div id="fb-1" class="feedback-overlay">
        <div id="fb-emoji-1" class="feedback-emoji">🌟</div>
        <div id="fb-text-1" class="feedback-text">答對了！太棒了！</div>
      </div>

      <div class="header-info">
        <div class="score-badge">⭐ 得分：<span id="score-1">0</span></div>
      </div>

      <div class="question-box">
        <div id="q-title-1" class="question-title">--</div>
      </div>

      <!-- 放大的鐘面容器與角落控制器 -->
      <div class="clock-stage">
        <div class="clock-wrapper">
          <div id="clock-stage-1" class="svg-container"></div>

          <!-- 時針調校 (左下角) -->
          <div class="corner-control left-control">
            <span class="control-title" style="color: #E05275;">時針</span>
            <div class="btn-pair">
              <button class="adj-btn hour-btn" onpointerdown="startAdjust(1, 'h', 1)" onpointerup="stopAdjust()" onpointerleave="stopAdjust()">+</button>
              <button class="adj-btn hour-btn" onpointerdown="startAdjust(1, 'h', -1)" onpointerup="stopAdjust()" onpointerleave="stopAdjust()">-</button>
            </div>
          </div>

          <!-- 分針調校 (右下角) -->
          <div class="corner-control right-control">
            <span class="control-title" style="color: #1D8A99;">分針</span>
            <div class="btn-pair">
              <button class="adj-btn min-btn" onpointerdown="startAdjust(1, 'm', 1)" onpointerup="stopAdjust()" onpointerleave="stopAdjust()">+</button>
              <button class="adj-btn min-btn" onpointerdown="startAdjust(1, 'm', -1)" onpointerup="stopAdjust()" onpointerleave="stopAdjust()">-</button>
            </div>
          </div>
        </div>
      </div>

      <button class="submit-btn" onclick="checkPlayerAnswer(1)">核對答案</button>
    </div>

    <!-- 玩家二區域 (P2, 雙人模式顯示) -->
    <div id="p2-card" class="player-card hidden">
      <div id="fb-2" class="feedback-overlay">
        <div id="fb-emoji-2" class="feedback-emoji">🌟</div>
        <div id="fb-text-2" class="feedback-text">答對了！太棒了！</div>
      </div>

      <div class="header-info">
        <div class="score-badge">⭐ 得分：<span id="score-2">0</span></div>
      </div>

      <div class="question-box">
        <div id="q-title-2" class="question-title">--</div>
      </div>

      <!-- 放大的鐘面容器與角落控制器 -->
      <div class="clock-stage">
        <div class="clock-wrapper">
          <div id="clock-stage-2" class="svg-container"></div>

          <!-- 時針調校 (左下角) -->
          <div class="corner-control left-control">
            <span class="control-title" style="color: #E05275;">時針</span>
            <div class="btn-pair">
              <button class="adj-btn hour-btn" onpointerdown="startAdjust(2, 'h', 1)" onpointerup="stopAdjust()" onpointerleave="stopAdjust()">+</button>
              <button class="adj-btn hour-btn" onpointerdown="startAdjust(2, 'h', -1)" onpointerup="stopAdjust()" onpointerleave="stopAdjust()">-</button>
            </div>
          </div>

          <!-- 分針調校 (右下角) -->
          <div class="corner-control right-control">
            <span class="control-title" style="color: #1D8A99;">分針</span>
            <div class="btn-pair">
              <button class="adj-btn min-btn" onpointerdown="startAdjust(2, 'm', 1)" onpointerup="stopAdjust()" onpointerleave="stopAdjust()">+</button>
              <button class="adj-btn min-btn" onpointerdown="startAdjust(2, 'm', -1)" onpointerup="stopAdjust()" onpointerleave="stopAdjust()">-</button>
            </div>
          </div>
        </div>
      </div>

      <button class="submit-btn" onclick="checkPlayerAnswer(2)">核對答案</button>
    </div>

  </div>
</div>

<script>
/* ====================================================
   2. Web Audio API 離線音效合成器 (不需外部檔案)
   ==================================================== */
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let isSoundOn = true;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new AudioContext();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playSynthTone(freq, type, duration, vol = 0.1) {
  if (!isSoundOn || !audioCtx) return;
  try {
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e){}
}

function playSoundClick() {
  playSynthTone(550, 'sine', 0.08, 0.08);
}

function playSoundTick() {
  playSynthTone(850, 'triangle', 0.03, 0.03);
}

function playSoundCorrect() {
  if (!isSoundOn || !audioCtx) return;
  const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
  notes.forEach((freq, idx) => {
    setTimeout(() => {
      playSynthTone(freq, 'sine', 0.25, 0.15);
    }, idx * 90);
  });
}

function playSoundWrong() {
  if (!isSoundOn || !audioCtx) return;
  playSynthTone(261.63, 'sine', 0.2, 0.12); // C4
  setTimeout(() => {
    playSynthTone(220.00, 'sine', 0.3, 0.12); // A3
  }, 120);
}

function toggleSound() {
  initAudio();
  isSoundOn = !isSoundOn;
  const btn = document.getElementById('sound-btn');
  btn.innerText = isSoundOn ? "🔊 音效：開" : "🔇 音效：關";
  if (isSoundOn) {
    btn.classList.add("active");
    playSoundClick();
  } else {
    btn.classList.remove("active");
  }
}

/* ====================================================
   3. 全域遊戲狀態與資料結構
   ==================================================== */
let currentLevel = 0;   // 0: 時正, 1: 時半, 2: 時與分
let currentMode = 1;    // 1: 單人, 2: 雙人
let isPromptOn = false; // 是否開啟外框 0-55 氣泡提示

// 玩家數據，時間以「總分鐘數」(0 - 719) 儲存
const players = {
  1: { time: 0, targetTime: 0, score: 0, hGroup: null, mGroup: null, bubbleGroup: null },
  2: { time: 0, targetTime: 0, score: 0, hGroup: null, mGroup: null, bubbleGroup: null }
};

let adjustIntervalTimer = null; // 長按按鈕連續觸發計時器

/* ====================================================
   4. SVG 聯動鐘面繪製 (viewBox: 0 0 250 250)
   ==================================================== */
function renderClockSVG(containerId, pId) {
  const svgNS = "http://www.w3.org/2000/svg";
  const container = document.getElementById(containerId);
  container.innerHTML = ""; // 清空容器

  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", "0 0 250 250");
  svg.style.width = "100%";
  svg.style.height = "100%";

  const cx = 125, cy = 125; // 鐘心座標

  // 1. 鐘面底盤
  const face = document.createElementNS(svgNS, "circle");
  face.setAttribute("cx", cx); face.setAttribute("cy", cy);
  face.setAttribute("r", "80");
  face.setAttribute("fill", "#FFFFFF");
  face.setAttribute("stroke", pId === 1 ? "#A9DEF9" : "#B5EAD7");
  face.setAttribute("stroke-width", "6");
  svg.appendChild(face);

  // 2. 60 個小格刻度與 1-12 大刻度數字
  for (let i = 0; i < 60; i++) {
    let angleRad = (i * 6 - 90) * Math.PI / 180;
    let isHour = (i % 5 === 0);
    let r1 = isHour ? 66 : 73;
    let r2 = 77;

    let x1 = cx + r1 * Math.cos(angleRad);
    let y1 = cy + r1 * Math.sin(angleRad);
    let x2 = cx + r2 * Math.cos(angleRad);
    let y2 = cy + r2 * Math.sin(angleRad);

    let tick = document.createElementNS(svgNS, "line");
    tick.setAttribute("x1", x1); tick.setAttribute("y1", y1);
    tick.setAttribute("x2", x2); tick.setAttribute("y2", y2);
    tick.setAttribute("stroke", isHour ? "#F8C8DC" : "#D0D0D0");
    tick.setAttribute("stroke-width", isHour ? "3.5" : "1.5");
    tick.setAttribute("stroke-linecap", "round");
    svg.appendChild(tick);

    // 鐘內 1-12 大數字
    if (isHour) {
      let num = i / 5;
      if (num === 0) num = 12;
      let tx = cx + 54 * Math.cos(angleRad);
      let ty = cy + 54 * Math.sin(angleRad);

      let text = document.createElementNS(svgNS, "text");
      text.setAttribute("x", tx); text.setAttribute("y", ty);
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("dominant-baseline", "central");
      text.setAttribute("font-size", "14");
      text.setAttribute("font-weight", "900");
      text.setAttribute("fill", "#4A4A4A");
      text.textContent = num;
      svg.appendChild(text);
    }
  }

  // 3. 【提示功能】：最外框 0, 5, 10, 15 ... 55 可愛氣泡標籤
  const bubbleGroup = document.createElementNS(svgNS, "g");
  bubbleGroup.setAttribute("class", "hint-bubbles");
  bubbleGroup.style.display = isPromptOn ? "inline" : "none";

  for (let i = 0; i < 12; i++) {
    let val = i * 5; // 0, 5, 10 ... 55
    let angleRad = (i * 30 - 90) * Math.PI / 180;
    let bx = cx + 104 * Math.cos(angleRad);
    let by = cy + 104 * Math.sin(angleRad);

    // 氣泡背景圓圈
    let bCircle = document.createElementNS(svgNS, "circle");
    bCircle.setAttribute("cx", bx); bCircle.setAttribute("cy", by);
    bCircle.setAttribute("r", "11.5");
    bCircle.setAttribute("fill", i % 2 === 0 ? "#FFD1DC" : "#B5EAD7");
    bCircle.setAttribute("stroke", "#FFFFFF");
    bCircle.setAttribute("stroke-width", "2");
    bubbleGroup.appendChild(bCircle);

    // 氣泡數字
    let bText = document.createElementNS(svgNS, "text");
    bText.setAttribute("x", bx); bText.setAttribute("y", by);
    bText.setAttribute("text-anchor", "middle");
    bText.setAttribute("dominant-baseline", "central");
    bText.setAttribute("font-size", "10.5");
    bText.setAttribute("font-weight", "900");
    bText.setAttribute("fill", "#2D2D2D");
    bText.textContent = val;
    bubbleGroup.appendChild(bText);
  }
  svg.appendChild(bubbleGroup);

  // 4. 時針群組 (珊瑚粉，短粗)
  const hGroup = document.createElementNS(svgNS, "g");
  const hLine = document.createElementNS(svgNS, "line");
  hLine.setAttribute("x1", cx); hLine.setAttribute("y1", cy);
  hLine.setAttribute("x2", cx); hLine.setAttribute("y2", cy - 40);
  hLine.setAttribute("stroke", "#FF6B8B");
  hLine.setAttribute("stroke-width", "8");
  hLine.setAttribute("stroke-linecap", "round");

  // 隱形加寬觸控線，利於特教學童觸控拖拽
  const hTouch = document.createElementNS(svgNS, "line");
  hTouch.setAttribute("x1", cx); hTouch.setAttribute("y1", cy);
  hTouch.setAttribute("x2", cx); hTouch.setAttribute("y2", cy - 40);
  hTouch.setAttribute("stroke", "transparent");
  hTouch.setAttribute("stroke-width", "36");
  hTouch.setAttribute("stroke-linecap", "round");
  hTouch.style.cursor = "pointer";

  hGroup.appendChild(hLine);
  hGroup.appendChild(hTouch);
  svg.appendChild(hGroup);

  // 5. 分針群組 (薄荷藍，長細)
  const mGroup = document.createElementNS(svgNS, "g");
  const mLine = document.createElementNS(svgNS, "line");
  mLine.setAttribute("x1", cx); mLine.setAttribute("y1", cy);
  mLine.setAttribute("x2", cx); mLine.setAttribute("y2", cy - 64);
  mLine.setAttribute("stroke", "#0096C7");
  mLine.setAttribute("stroke-width", "5");
  mLine.setAttribute("stroke-linecap", "round");

  const mTouch = document.createElementNS(svgNS, "line");
  mTouch.setAttribute("x1", cx); mTouch.setAttribute("y1", cy);
  mTouch.setAttribute("x2", cx); mTouch.setAttribute("y2", cy - 64);
  mTouch.setAttribute("stroke", "transparent");
  mTouch.setAttribute("stroke-width", "36");
  mTouch.setAttribute("stroke-linecap", "round");
  mTouch.style.cursor = "pointer";

  mGroup.appendChild(mLine);
  mGroup.appendChild(mTouch);
  svg.appendChild(mGroup);

  // 6. 中心粉紅軸心
  const centerCircle = document.createElementNS(svgNS, "circle");
  centerCircle.setAttribute("cx", cx); centerCircle.setAttribute("cy", cy);
  centerCircle.setAttribute("r", "7.5");
  centerCircle.setAttribute("fill", "#FF6B8B");
  svg.appendChild(centerCircle);

  const centerDot = document.createElementNS(svgNS, "circle");
  centerDot.setAttribute("cx", cx); centerDot.setAttribute("cy", cy);
  centerDot.setAttribute("r", "2.5");
  centerDot.setAttribute("fill", "#FFFFFF");
  svg.appendChild(centerDot);

  container.appendChild(svg);

  // 記錄 DOM 引用
  players[pId].hGroup = hGroup;
  players[pId].mGroup = mGroup;
  players[pId].bubbleGroup = bubbleGroup;

  // 綁定手指與滑鼠拖拽事件
  bindPointerDrag(hTouch, false, pId, svg);
  bindPointerDrag(mTouch, true, pId, svg);
}

/* 更新鐘面指針旋轉角度 (時針與分針物理聯動) */
function updateClockVisual(pId) {
  let totalMins = players[pId].time;
  let hAngle = (totalMins / 720) * 360;  // 720 分鐘為 360 度 (30度/小時)
  let mAngle = (totalMins % 60) * 6;     // 60 分鐘為 360 度 (6度/分鐘)

  players[pId].hGroup.setAttribute("transform", `rotate(${hAngle} 125 125)`);
  players[pId].mGroup.setAttribute("transform", `rotate(${mAngle} 125 125)`);
}

/* 拖拽指針邏輯 */
function bindPointerDrag(element, isMinuteHand, pId, svg) {
  element.addEventListener('pointerdown', (e) => {
    initAudio();
    e.preventDefault();
    element.setPointerCapture(e.pointerId);

    function getAngleFromCenter(evt) {
      let rect = svg.getBoundingClientRect();
      let x = evt.clientX - (rect.left + rect.width / 2);
      let y = evt.clientY - (rect.top + rect.height / 2);
      let angle = Math.atan2(y, x) * (180 / Math.PI) + 90;
      if (angle < 0) angle += 360;
      return angle;
    }

    function onPointerMove(me) {
      let angle = getAngleFromCenter(me);
      let currentT = players[pId].time;

      if (isMinuteHand) {
        // 撥動分針
        let targetMin = Math.round(angle / 6) % 60;
        let currentMin = currentT % 60;
        let diff = targetMin - currentMin;

        if (diff > 30) diff -= 60;
        if (diff < -30) diff += 60;

        if (diff !== 0) {
          players[pId].time = (currentT + diff + 720) % 720;
          playSoundTick();
          updateClockVisual(pId);
        }
      } else {
        // 撥動時針
        let targetTotalMin = Math.round((angle / 360) * 720);
        let diff = targetTotalMin - currentT;

        if (diff > 360) diff -= 720;
        if (diff < -360) diff += 720;

        if (Math.abs(diff) >= 2) {
          players[pId].time = (currentT + diff + 720) % 720;
          playSoundTick();
          updateClockVisual(pId);
        }
      }
    }

    function onPointerUp(ue) {
      element.releasePointerCapture(ue.pointerId);
      element.removeEventListener('pointermove', onPointerMove);
      element.removeEventListener('pointerup', onPointerUp);
    }

    element.addEventListener('pointermove', onPointerMove);
    element.addEventListener('pointerup', onPointerUp);
  });
}

/* ====================================================
   5. 微調按鈕邏輯 (+ / - 按鈕長按與點擊)
   ==================================================== */
function adjustTime(pId, type, dir) {
  initAudio();
  let delta = 0;
  if (type === 'h') {
    delta = dir * 60; // 時針變動 1 小時
  } else {
    delta = dir * 1;  // 分針變動 1 分鐘
  }

  players[pId].time = (players[pId].time + delta + 720) % 720;
  playSoundTick();
  updateClockVisual(pId);
}

function startAdjust(pId, type, dir) {
  adjustTime(pId, type, dir);
  stopAdjust();
  adjustIntervalTimer = setInterval(() => {
    adjustTime(pId, type, dir);
  }, 140);
}

function stopAdjust() {
  if (adjustIntervalTimer) {
    clearInterval(adjustIntervalTimer);
    adjustIntervalTimer = null;
  }
}

/* ====================================================
   6. 題目生成與核對
   ==================================================== */
function generateQuestion(pId) {
  let h, m, qText, targetMins;
  let oldTarget = players[pId].targetTime;

  do {
    if (currentLevel === 0) { // 時正
      h = Math.floor(Math.random() * 12) + 1;
      m = 0;
      qText = `${h} 時正`;
    } else if (currentLevel === 1) { // 時半
      h = Math.floor(Math.random() * 12) + 1;
      m = 30;
      qText = `${h} 時半`;
    } else { // 時與分
      h = Math.floor(Math.random() * 12) + 1;
      m = Math.floor(Math.random() * 60);
      qText = `${h} 時 ${m} 分`;
    }

    let hCalc = (h === 12) ? 0 : h;
    targetMins = hCalc * 60 + m;
  } while (targetMins === oldTarget);

  players[pId].targetTime = targetMins;

  // 起始干擾位置 (避免與答案直接重疊)
  let offset = (Math.floor(Math.random() * 5) + 1) * 60;
  players[pId].time = (targetMins + offset) % 720;

  document.getElementById(`q-title-${pId}`).innerText = qText;
  document.getElementById(`fb-${pId}`).classList.remove("show");

  updateClockVisual(pId);
}

function refreshAllQuestions() {
  initAudio(); playSoundClick();
  generateQuestion(1);
  if (currentMode === 2) generateQuestion(2);
}

// 切換關卡
function selectLevel(lvl) {
  initAudio(); playSoundClick();
  currentLevel = lvl;
  for (let i = 0; i <= 2; i++) {
    document.getElementById(`lvl-btn-${i}`).classList.remove('active');
  }
  document.getElementById(`lvl-btn-${lvl}`).classList.add('active');
  refreshAllQuestions();
}

// 切換人數模式 (1人 / 2人)
function selectMode(mode) {
  initAudio(); playSoundClick();
  currentMode = mode;
  document.getElementById('mode-btn-1').classList.remove('active');
  document.getElementById('mode-btn-2').classList.remove('active');
  document.getElementById(`mode-btn-${mode}`).classList.add('active');

  const p2Card = document.getElementById('p2-card');
  if (mode === 1) {
    p2Card.classList.add('hidden');
  } else {
    p2Card.classList.remove('hidden');
    generateQuestion(2);
  }
}

// 切換提示 (開 / 關外框 0-55 氣泡)
function togglePrompt() {
  initAudio(); playSoundClick();
  isPromptOn = !isPromptOn;
  
  const btn = document.getElementById('prompt-btn');
  btn.innerText = isPromptOn ? "💡 提示：開" : "💡 提示：關";
  if (isPromptOn) {
    btn.classList.add("active");
  } else {
    btn.classList.remove("active");
  }

  // 切換外圈 0-55 氣泡顯示
  [1, 2].forEach(pId => {
    if (players[pId].bubbleGroup) {
      players[pId].bubbleGroup.style.display = isPromptOn ? "inline" : "none";
    }
  });
}

// 核對答案
function checkPlayerAnswer(pId) {
  initAudio();
  let userTime = players[pId].time % 720;
  let targetTime = players[pId].targetTime % 720;

  let fbOverlay = document.getElementById(`fb-${pId}`);
  let fbEmoji = document.getElementById(`fb-emoji-${pId}`);
  let fbText = document.getElementById(`fb-text-${pId}`);

  if (userTime === targetTime) {
    playSoundCorrect();
    players[pId].score += 10;
    document.getElementById(`score-${pId}`).innerText = players[pId].score;

    fbEmoji.innerText = "🌟";
    fbText.innerText = "答對了！太棒了！";
    fbOverlay.classList.add("show");

    setTimeout(() => {
      fbOverlay.classList.remove("show");
      generateQuestion(pId);
    }, 1500);
  } else {
    playSoundWrong();
    fbEmoji.innerText = "💪";
    fbText.innerText = "再試試看喔！";
    fbOverlay.classList.add("show");

    setTimeout(() => {
      fbOverlay.classList.remove("show");
    }, 1200);
  }
}

/* ====================================================
   7. 遊戲啟動初始化
   ==================================================== */
window.onload = function() {
  renderClockSVG("clock-stage-1", 1);
  renderClockSVG("clock-stage-2", 2);

  selectLevel(0);
  selectMode(1);
};
</script>
